name: Security

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  source-security:
    name: secret scan · production SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 현재 파일뿐 아니라 Git 이력에 들어간 비밀도 검사한다.
          fetch-depth: 0

      - name: Gitleaks 8.30.1 설치
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Git 이력 비밀 스캔
        run: gitleaks git --redact --no-banner .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: SAST 판정기 단위 시험
        run: npm run test:security:sast-gate
      - name: 운영 의존성 Critical 취약점 차단
        run: npm run check:security:deps

  sast:
    name: CodeQL SAST · Critical 0
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CodeQL 초기화
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: CodeQL 분석과 결과 업로드
        id: codeql
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
          output: codeql-results
          upload: always
      - name: SAST Critical 취약점 차단
        run: npm run check:security:sast -- "${{ steps.codeql.outputs.sarif-output }}"

  sbom:
    name: SPDX SBOM
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SPDX JSON SBOM 생성·보관
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ./package-lock.json
          format: spdx-json
          output-file: wonseoro.spdx.json
          artifact-name: wonseoro-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: SBOM 형식·내용 검증
        run: npm run check:security:sbom -- wonseoro.spdx.json

  release-sbom:
    name: 릴리스 SPDX SBOM 첨부
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SPDX JSON SBOM 생성·릴리스 첨부
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ./package-lock.json
          format: spdx-json
          output-file: wonseoro-${{ github.event.release.tag_name }}.spdx.json
          artifact-name: wonseoro-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true
      - name: SBOM 형식·내용 검증
        run: npm run check:security:sbom -- "wonseoro-${{ github.event.release.tag_name }}.spdx.json"
