name: CI

on:
  push:
    branches: [main]
  pull_request:

# 앱별로 잡을 분리한다. 프론트 수정이 백엔드 테스트를 돌리지 않는다. (ADR-0002)
jobs:
  contracts:
    name: contracts (계약 — 변경 시 두 사람 리뷰 필수)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @wonseoro/contracts
      - run: npm run typecheck -w @wonseoro/server-kit
      # TODO(M1): OpenAPI lint + breaking-change 검사 (첨부 배치 후)
      # TODO(M1): CloudEvents JSON Schema 검증

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @wonseoro/contracts -w @wonseoro/server-kit
      - run: npm run typecheck -w @wonseoro/admission-api -w @wonseoro/central-api -w @wonseoro/document-service -w @wonseoro/event-relay
      - run: npm run test -w @wonseoro/admission-api --if-present

  integration:
    name: integration (실 PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wonseoro
          POSTGRES_PASSWORD: wonseoro
          POSTGRES_DB: univ_a
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wonseoro -d univ_a"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://wonseoro:wonseoro@localhost:5432/univ_a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # canonical DDL 을 그대로 적용한다. 저장소에서 따로 쓴 스키마가 아니다.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/migrations/0001_init.sql
      # 제약이 실제로 막는지 먼저 확인한다
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/verify-constraints.sql
      - run: npm run test -w @wonseoro/admission-api
      # 중앙 Plane 은 스키마가 다르다. 같은 인스턴스에 별도 DB 로 올린다.
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE central'
      - run: psql "${DATABASE_URL%/*}/central" -v ON_ERROR_STOP=1 -f infra/db/central/0001_init.sql
      - run: psql "${DATABASE_URL%/*}/central" -v ON_ERROR_STOP=1 -f infra/db/central/0002_vault.sql
      - run: npm run test -w @wonseoro/central-api
        env:
          DATABASE_URL: postgresql://wonseoro:wonseoro@localhost:5432/central

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @wonseoro/frontend

  # M5에서 활성화 — 기술설계서 v1.0 §8.4 CI/CD Security Gate 10종
  # security:
  #   1. Secret Scan  2. SAST  3. SCA/CVE  4. SBOM  5. Container Image Scan
  #   6. IaC/K8s Manifest Scan  7. Unit/Integration Security Test  8. DAST
  #   9. Image Signing  10. Admission Controller에서 미서명 이미지 배포 거부
