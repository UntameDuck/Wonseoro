# K-Admission 대학 Data Plane — 기본값
#
# 키 구조는 노션 §05 첨부 `values-m.yaml`(canonical, 이 폴더에 그대로 둔다)을 따른다.
# Size Profile 파일(values-s/m/l)이 이 기본값 위에 얹힌다. 대학별 값은 deploy/universities/<ID>/.
#
#   helm install univ-a deploy/charts/k-admission \
#     -f deploy/charts/k-admission/values-m.yaml -f deploy/universities/UNIV-A/values.yaml
#
# 첫 첨부와 달랐던 것 — 불일치 대장 D-44. v1.2 첨부(values-m·runtime, 2026-09-30)는 이 차트에 맞췄다.
# runtime 첨부는 이 차트의 렌더링 결과다 (scripts/render-runtime-attachment.mjs, CI 가 드리프트를 막는다)
#   · global.configVersion / deadlinePolicyVersion 은 **렌더링하지 않는다.** 마감·설정은 DB 의
#     서명된 활성화 기록(2인 승인)이 기준이다. 배포 값으로 주입하면 단독 변경 경로가 된다
#   · reconciliation.schedule 은 CronJob 이 아니다 — 대조는 접수 API 안의 스케줄러(advisory lock)가 돈다.
#     reconciliation.intervalMs 로 주기를 준다
#   · 포트 3001, 프로브 /healthz · /readyz (계약 v1.2.0, D-32)

global:
  universityId: ""                 # 필수. 대학 식별자 (예: UNIV-A)
  environment: production          # production | staging | local
  imageRegistry: registry.example.kr/k-admission
  imagePullPolicy: IfNotPresent
  # 이미지 태그. digest 가 있으면 digest 를 쓴다. production 은 digest 필수 (§A6 Digest Pinning)
  imageTag: ""

# 지원자 화면. Data Plane 에 함께 두지만 이 차트의 첫 판에서는 끈다 (이미지 미작성).
frontend:
  enabled: false
  image: { repository: frontend, digest: "" }
  replicas: 2
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  podDisruptionBudget: { minAvailable: 1 }

api:
  image: { repository: admission-api, digest: "" }
  replicas: 2
  port: 3001
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 60
    # 커스텀 지표는 metrics adapter(Prometheus Adapter 등)가 있어야 동작한다 (T-M4-08).
    customMetrics:
      requestRatePerPod: 120
      p95LatencyMs: 500
      activeRequestsPerPod: 150
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "8Gi" }
  podDisruptionBudget: { minAvailable: 1 }
  terminationGracePeriodSeconds: 45
  # 운영은 ClusterIP 뒤에 Ingress(edge 존). NodePort 는 로컬(kind) 시험용
  service: { type: ClusterIP, nodePort: null }
  # 비밀이 아닌 추가 환경변수 (대학별 values 에서 준다)
  env: {}

eventRelay:
  enabled: true
  image: { repository: event-relay, digest: "" }
  replicas: 2
  port: 3002
  batchSize: 100
  maxInFlight: 500                 # 첨부 값. 현재 relay 는 배치 단위로 보내 쓰지 않는다
  backoff: { initialMs: 500, maxMs: 30000, jitter: true }
  intervalMs: 2000
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  env: {}

documentService:
  enabled: true
  image: { repository: document-service, digest: "" }
  replicas: 1
  port: 3003
  # production 은 실 검사 엔진이 필요하다 (mock 이면 기동하지 않는다, T-M5-08). 실 엔진: clamav (D-58)
  scannerEngine: mock
  # clamav 엔진 — clamd 주소. 같은 Pod 사이드카면 127.0.0.1, 별도 서비스면 그 서비스 이름
  clamav:
    host: ""
    port: 3310
  # clamav 일 때 워커가 나가야 하는 곳 — clamd 와 Object Storage(접수 API 가 준 서명 URL 로 읽는다).
  # 워커는 저장소 자격증명이 없다. 비우면 워커의 출구는 접수 API 뿐이다
  scannerEgress:
    to: []
    ports: []
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  env: {}

reconciliation:
  maxBatch: 500
  intervalMs: 3600000              # 앱 안 스케줄러 주기
  sinceHours: 48

# 지원자 단위 Adaptive Throttling (T-M4-40, ADR-0007). IP 가 아니라 인증된 지원자·원서 기준이다.
# enforce | observe(판정만 세고 막지 않음 — 운영 첫 적용 때) | off
throttle:
  mode: enforce

# Peak Mode (T-M4-07). 운영에서는 대학별 peak-schedule.yaml → 예약 자동화가 만든
# deploy/universities/<UNIV>/peak-mode.yaml 이 마지막에 얹혀 이 값을 정한다 (D-48, ADR-0006).
peakMode:
  enabled: false                   # 사전 확장 — API 최소 replica 상향
  window: ""                       # 예약 창 id (자동 생성 overlay 가 채운다)
  scheduledActivation: ""          # 비핵심 작업 억제 시작 (RFC3339)
  scheduledEnd: ""                 # 억제 종료 — 지나면 앱이 스스로 억제를 푼다
  apiMinReplicas: 4
  frontendMinReplicas: 2
  suspendNonCriticalJobs: true

database:
  mode: external-ha                # DB 는 클러스터 밖 HA 계층 (T-M4-06)
  host: ""
  port: 5432
  sslMode: verify-full
  pool:
    maxPerPod: 10
    minPerPod: 2
    # 이 대학 DB 에 허용하는 전체 커넥션. 렌더링 때 Σ(replica 상한 × Pod 당 상한) 을 검사한다
    connectionBudget: 200
  pooler:
    enabled: true
    image: { repository: pgbouncer, digest: "" }
    replicas: 2
    port: 6432
    poolMode: transaction
    defaultPoolSize: 10
    reservePoolSize: 2
    maxClientConnections: 500
    queryWaitTimeoutSeconds: 15
    clientTlsSslMode: require
    clientTlsSecretName: ""            # 기본: <release>-pgbouncer-tls, 키 tls.crt·tls.key
    serverTlsSslMode: verify-full
    serverTlsCaFile: /etc/pgbouncer-ca/ca.crt
    caSecretName: ""                 # 기본: <release>-database-ca, 키 ca.crt
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "1", memory: "256Mi" }
    podDisruptionBudget: { minAvailable: 1 }
    # 정상 종료 (ADR-0008): preStop 으로 엔드포인트에서 빠진 뒤 SIGTERM. 앱 DB 풀이 연결을 사용 횟수(50회)·idle 시한(10초)으로
    # 돌려 클라이언트가 다 떠나기를 기다린다 — grace 는 preStop + 연결이 도는 시간보다 길게. 짧으면 SIGKILL 이 쓰던 연결을 끊는다
    preStopSleepSeconds: 10
    terminationGracePeriodSeconds: 60
    # PgBouncer Service 의 trafficDistribution(PreferSameZone·PreferClose). **기본은 끈다** (ADR-0008).
    # 켜 보니 노드 장애 때 이득은 작고(첫 시도 실패 6.9% → 5.7%, 실패는 거의 다 죽은 API Pod 로 간 연결),
    # PgBouncer·API rolling restart 중 사용자 체감 실패가 0 → 10 건으로 늘었다(kind 실측, 클러스터 안 부하).
    trafficDistribution: ""

redis:
  host: ""
  port: 6379
  tls: true

objectStorage:
  endpoint: ""
  bucket: ""
  directUpload: true
  presignTtlSeconds: 600
  publicAccess: false

centralSync:
  endpoint: ""                     # 중앙 Sync Gateway 이벤트 수신 URL (…/internal/v1/events)
  mtls: true
  offlineSpool:
    enabled: true
    maxAgeHours: 72
    highWatermarkEvents: 100000

# 비밀은 차트가 만들지 않는다 — Vault 등이 넣은 Secret 을 이름으로 참조한다 (§06).
# 넣을 키: DATABASE_URL, AUDIT_IP_SALT, CENTRAL_ID_SALT, CENTRAL_SUBJECT_KEY, ADMIN_API_TOKEN,
#          PG_CALLBACK_SECRET, POLICY_SIGNING_KEY, S3_ACCESS_KEY, S3_SECRET_KEY
runtimeSecret:
  name: ""                         # 기본: <release>-runtime
  # local 환경에서만 허용. production 에서 true 면 렌더링이 실패한다
  create: false
  data: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
  dropAllCapabilities: true
  automountServiceAccountToken: false

observability:
  otelEndpoint: ""
  includeRequestBody: false
  piiLabelsAllowed: false
  metrics:
    enabled: true
    port: 9464
    ingressFrom:
      - namespaceSelector: { matchLabels: { kadmission-zone: observability } }
        podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  collectorEgress:
    to:
      - namespaceSelector: { matchLabels: { kadmission-zone: observability } }
        podSelector: { matchLabels: { app.kubernetes.io/name: opentelemetry-collector } }
    ports: [4317]

networkPolicy:
  defaultDeny: true
  # 공개 트래픽이 들어오는 경로 (§06 첨부: edge 네임스페이스의 ingress-nginx).
  # ingress-nginx 는 2026-03 은퇴 — 운영은 Gateway API 컨트롤러의 선택자로 바꾼다 (D-53, ADR-0008)
  ingressFrom:
    - namespaceSelector: { matchLabels: { kadmission-zone: edge } }
      podSelector: { matchLabels: { app.kubernetes.io/name: ingress-nginx } }
  # DB와 Redis 경로를 분리한다. Pooler 사용 시 API·Relay가 DB로 직접 우회하지 못해야 한다.
  databaseEgress:
    to:
      - namespaceSelector: { matchLabels: { kadmission-zone: data } }
    ports: [5432]
  cacheEgress:
    to:
      - namespaceSelector: { matchLabels: { kadmission-zone: data } }
    ports: [6379]
  # 외부(중앙·PG·Object Storage)로 나가는 경로. 첨부는 egress-gateway 하나로 모은다
  controlledEgress:
    to:
      - namespaceSelector: { matchLabels: { kadmission-zone: egress } }
        podSelector: { matchLabels: { app: egress-gateway } }
    ports: [8443]

# 서비스 간 상호 TLS (T-M5-05, D-69) — 대학 API 는 HTTPS 로 듣고 내부 경로(/internal/**)는 같은 대학 서류 워커 인증서만,
# Relay·서류 워커·대학 API 는 중앙·대학 API 를 부를 때 자기 인증서를 낸다. 운영은 끌 수 없다(validate.yaml)
internalTls:
  enabled: true
  mountPath: /etc/wonseoro/mtls
  # 워크로드별 Secret(tls.crt·tls.key·ca.crt). 비우면 <release>-<워크로드>-mtls. Vault PKI 가 짧은 TTL 로 채운다(docs/13 단계 4)
  secrets:
    api: ""
    event-relay: ""
    document-service: ""

rbac:
  create: true
  # 첨부 §06 의 그룹 이름
  sreGroup: kadmission-sre
  # 감사 그룹은 첨부대로 platform-viewer 에 더해 security-auditor 도 받는다 (D-68)
  auditorGroup: kadmission-auditors
  # 조회 전용 그룹 — 비우면 바인딩을 만들지 않는다
  viewerGroup: kadmission-viewers
  # 비상 역할 — 평소 비활성(바인딩 없음). 켤 때는 그룹·끝나는 시각·사유를 함께 (T-M5-03 이 TTL·경보를 맡는다)
  breakGlass:
    group: ""
    expiresAt: ""
    reason: ""

nodePlacement:
  topologyKey: topology.kubernetes.io/zone
  spreadMaxSkew: 1
  # 존이 하나인 로컬 클러스터에서는 ScheduleAnyway 로 둔다
  whenUnsatisfiable: DoNotSchedule
  # 장애로 taint 된 노드(NotReady·unreachable)를 분산 계산에서 뺀다 (D-52). 기본(Ignore)이면 zone 이 2개일 때
  # 한 zone 이 죽는 동안 대체 Pod·HPA 확장 Pod 를 남은 zone 에 둘 수 없다 — 죽은 zone 이 0 개로 세어져 maxSkew 를 넘는다.
  # 대가: drain 으로 cordon 된 zone 도 빠지므로 정비 동안 Pod 가 한 zone 에 모이고, uncordon 뒤 저절로 다시 나뉘지 않는다.
  # 정비 절차에 "uncordon 뒤 rollout restart"(또는 descheduler) 를 둔다 (ADR-0008). Kubernetes 1.26+
  nodeTaintsPolicy: Honor
  # 분산을 같은 버전(ReplicaSet)의 Pod 끼리만 센다. 없으면 rollout 중 옛 Pod 가 세어져, 교체가 끝난 뒤
  # 새 Pod 가 한 zone 에 몰릴 수 있다(2 replica 에서 실측). Kubernetes 1.27+
  matchLabelKeys: [pod-template-hash]
