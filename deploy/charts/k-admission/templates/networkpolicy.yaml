{{- /*
  §06 첨부 network-rbac.yaml 을 따른다 — default deny 에서 시작해 필요한 길만 연다.
  첨부에 더한 것: Relay·서류 워커 경로 (첨부에는 API 만 있다), 서류 워커 → API 내부 경로.
  대학 간 경로는 어디에도 없다 — 다른 대학 클러스터로 나가는 규칙을 만들지 않는다.
*/ -}}
{{- $v := .Values -}}
{{- if $v.networkPolicy.defaultDeny }}
{{- $inst := .Release.Name }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-default-deny
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
  policyTypes: [Ingress, Egress]
---
# 공개 트래픽 → 접수 API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-ingress-to-api
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      network-role: api
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml $v.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $v.api.port }}
    # 서류 검사 워커 → 접수 API 내부 경로 (/internal/v1/documents)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app: document-service
      ports:
        - protocol: TCP
          port: {{ $v.api.port }}
---
{{- if $v.observability.metrics.enabled }}
# Prometheus → 접수 API 지표 포트. 공개 API 포트와 수집 경로를 분리한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-prometheus-to-api
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      network-role: api
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml $v.observability.metrics.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $v.observability.metrics.port }}
---
{{- end }}
# DNS — 모든 워크로드
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-dns
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 접수 API · Relay → Redis (클러스터 밖 HA 계층)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-cache
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
      - { key: network-role, operator: In, values: [api, relay] }
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml $v.networkPolicy.cacheEgress.to | nindent 8 }}
      ports:
        {{- range $v.networkPolicy.cacheEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
{{- if $v.database.pooler.enabled }}
# 접수 API · Relay → PgBouncer. DB 직접 경로는 열지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-app-to-pgbouncer
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app: pgbouncer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
              - { key: network-role, operator: In, values: [api, relay] }
      ports:
        - { protocol: TCP, port: {{ $v.database.pooler.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-app-to-pgbouncer-egress
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
      - { key: network-role, operator: In, values: [api, relay] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app: pgbouncer
      ports:
        - { protocol: TCP, port: {{ $v.database.pooler.port }} }
---
# PgBouncer만 외부 DB에 연결한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-pgbouncer-to-database
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app: pgbouncer
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml $v.networkPolicy.databaseEgress.to | nindent 8 }}
      ports:
        {{- range $v.networkPolicy.databaseEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
{{- else }}
# Pooler를 끈 설치만 API · Relay의 DB 직접 연결을 허용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-database-direct
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
      - { key: network-role, operator: In, values: [api, relay] }
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml $v.networkPolicy.databaseEgress.to | nindent 8 }}
      ports:
        {{- range $v.networkPolicy.databaseEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
{{- end }}
# 접수 API · Relay → 외부(중앙 Sync·PG·Object Storage)는 통제된 출구로만
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-controlled-egress
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
      - { key: network-role, operator: In, values: [api, relay] }
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml $v.networkPolicy.controlledEgress.to | nindent 8 }}
      ports:
        {{- range $v.networkPolicy.controlledEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
{{- if $v.observability.otelEndpoint }}
# 접수 API → OpenTelemetry Collector (OTLP/gRPC)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-api-to-otel-collector
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      network-role: api
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml $v.observability.collectorEgress.to | nindent 8 }}
      ports:
        {{- range $v.observability.collectorEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
{{- end }}
# 서류 검사 워커 → 접수 API 만
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ka.fullname" . }}-allow-worker-to-api
  labels: {{- include "ka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app: document-service
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              network-role: api
      ports:
        - { protocol: TCP, port: {{ $v.api.port }} }
{{- end }}
