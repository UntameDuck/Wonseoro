{{- /*
§06 역할 6종 — 네임스페이스 범위, cluster-admin 없음 (T-M5-02 단계 8, D-68)
  platform-viewer·sre-operator·release-controller  첨부 network-rbac.yaml 의 셋 그대로
  security-auditor   보안 설정·감사 조회 전용. Secret·로그·exec 없음
  break-glass        평소 바인딩 없음(= 비활성). 켜는 길은 rbac.breakGlass.group — 서명 커밋·2인 리뷰를 거쳐야 한다.
                     짧은 TTL·사용 즉시 경보는 T-M5-03. RBAC 을 바꾸지 못한다(스스로 권한을 늘리지 못하게)
  admission-admin    Kubernetes 권한 없음 — Role 도 바인딩도 두지 않는다(업무는 운영 API 로만)
배포 계정(gitops release-controller)이 이 Role 들을 만든다. Kubernetes 는 자기가 가진 권한 밖의 Role 을 만들지 못하게
하므로(권한 상승 방지) 여기 Role 들은 그 계정 권한의 부분집합이어야 한다 — tests/auth/k8s-rbac-kind.mjs 가 본다.
sre-operator 의 Deployment 수정은 플랫폼 승인 정책(deploy/platform/rbac/sre-operator-guard.yaml)이 규모·재시작으로 좁힌다.
*/ -}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ka.fullname" . }}-platform-viewer
  labels: {{- include "ka.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ka.fullname" . }}-sre-operator
  labels: {{- include "ka.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get","list","watch","patch","update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ka.fullname" . }}-release-controller
  labels: {{- include "ka.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","patch","update"]
  - apiGroups: [""]
    resources: ["configmaps","services"]
    verbs: ["get","list","watch","create","patch","update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get","list","watch","create","patch","update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch","create","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ka.fullname" . }}-security-auditor
  labels: {{- include "ka.labels" . | nindent 4 }}
rules:
  # 누가 무엇을 할 수 있나 · 무엇과 통신할 수 있나 · 무엇이 돌고 있나(이미지 digest·보안 설정) · 무슨 일이 있었나
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get","list","watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "pods", "services", "events"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ka.fullname" . }}-break-glass
  labels: {{- include "ka.labels" . | nindent 4 }}
rules:
  # 장애 대응에 필요한 것 — Secret 교체 포함. exec·RBAC 변경은 없다(DB 비상 접속은 Vault 의 break-glass 경로)
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ka.fullname" . }}-sre-operator
  labels: {{- include "ka.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ .Values.rbac.sreGroup }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ include "ka.fullname" . }}-sre-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ka.fullname" . }}-viewer
  labels: {{- include "ka.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ .Values.rbac.auditorGroup }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ include "ka.fullname" . }}-platform-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ka.fullname" . }}-security-auditor
  labels: {{- include "ka.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ .Values.rbac.auditorGroup }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ include "ka.fullname" . }}-security-auditor
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.rbac.viewerGroup }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ka.fullname" . }}-platform-viewer
  labels: {{- include "ka.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ .Values.rbac.viewerGroup }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ include "ka.fullname" . }}-platform-viewer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- /*
  비상 역할 바인딩은 끝나는 시각 전에만 렌더링한다(T-M5-03) — 지나면 GitOps 가 다음 조정 때 지우고 되살리지 않는다.
  그 사이는 회수 CronJob(break-glass.yaml)이 매분 지운다. 끝나는 시각은 렌더링 시점에서 12시간 안이어야 한다(짧은 TTL).
*/ -}}
{{- $bg := .Values.rbac.breakGlass -}}
{{- $bgActive := false -}}
{{- if $bg.group -}}
  {{- $exp := toDate "2006-01-02T15:04:05Z07:00" (required "rbac.breakGlass.expiresAt 이 필요합니다(비상 역할은 끝나는 시각과 함께 켠다)" $bg.expiresAt) -}}
  {{- $left := sub (unixEpoch $exp | int64) (unixEpoch now | int64) -}}
  {{- if gt $left 43200 -}}{{- fail "rbac.breakGlass.expiresAt 은 지금부터 12시간 안이어야 한다 — 비상 역할은 짧게 켠다(T-M5-03)" -}}{{- end -}}
  {{- $bgActive = gt $left 0 -}}
{{- end }}
{{- if $bgActive }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ka.fullname" . }}-break-glass
  labels: {{- include "ka.labels" . | nindent 4 }}
  annotations:
    # 언제까지 켜 두는가 — 지나면 경보·회수(T-M5-03). 비워 두면 렌더링을 거부한다
    kadmission.kr/break-glass-expires-at: {{ required "rbac.breakGlass.expiresAt 이 필요합니다(비상 역할은 끝나는 시각과 함께 켠다)" .Values.rbac.breakGlass.expiresAt | quote }}
    kadmission.kr/break-glass-reason: {{ required "rbac.breakGlass.reason 이 필요합니다" .Values.rbac.breakGlass.reason | quote }}
subjects:
  - kind: Group
    name: {{ .Values.rbac.breakGlass.group }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ include "ka.fullname" . }}-break-glass
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
