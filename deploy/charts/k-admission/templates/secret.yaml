{{- /*
  local 환경 전용. production 은 validate.yaml 이 막는다 — Vault 가 넣은 Secret 을 참조한다.
*/ -}}
{{- if .Values.runtimeSecret.create }}
{{- if eq .Values.global.environment "production" }}{{ fail "production 에서 runtimeSecret.create 불가" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ka.runtimeSecret" . }}
  labels: {{- include "ka.labels" . | nindent 4 }}
  annotations:
    kadmission.kr/warning: "local development values only"
type: Opaque
stringData:
  {{- range $k, $val := .Values.runtimeSecret.data }}
  {{ $k }}: {{ $val | toString | quote }}
  {{- end }}
{{- end }}
