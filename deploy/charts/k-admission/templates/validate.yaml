{{- /*
  렌더링 단계에서 막는 것. 클러스터에 올라간 뒤 발견하면 늦다.
*/ -}}
{{- $v := .Values -}}
{{- if not $v.global.universityId -}}
{{- fail "global.universityId 가 필요하다 — 대학마다 하나씩 설치한다" -}}
{{- end -}}
{{- /* 출구 규칙에 전체 인터넷·클라우드 메타데이터 대역을 넣지 못한다 (T-M5-01·07). 한 줄 실수로 기본 차단이 무너진다 */ -}}
{{- $egress := list $v.networkPolicy.databaseEgress $v.networkPolicy.cacheEgress $v.networkPolicy.controlledEgress $v.documentService.scannerEgress $v.observability.collectorEgress ($v.accessGrantSync | default dict).issuerEgress -}}
{{- range $e := $egress -}}
{{- range $to := (($e | default dict).to | default list) -}}
{{- with $to.ipBlock -}}
{{- if or (eq .cidr "0.0.0.0/0") (eq .cidr "::/0") (hasPrefix "169.254." .cidr) (hasPrefix "fe80:" (lower .cidr)) (hasPrefix "fd00:ec2:" (lower .cidr)) (eq .cidr "100.100.100.200/32") -}}
{{- fail (printf "NetworkPolicy 출구에 %s 를 열 수 없다 — 전체 인터넷·클라우드 메타데이터 대역은 막혀 있어야 한다 (T-M5-01·07)" .cidr) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (eq $v.global.environment "production") (not $v.internalTls.enabled) -}}
{{- fail "운영(global.environment=production)은 internalTls.enabled 를 끌 수 없다 — 내부 경로가 인증 없이 열린다 (T-M5-05, D-69)" -}}
{{- end -}}
{{- /* 담당자 로그인을 쓰는 운영은 권한 부여·변경·말소 기록 수집을 끌 수 없다 (안전성 확보조치 기준 제5조 ③, G-15·D-91) */ -}}
{{- if and (eq $v.global.environment "production") (eq (toString (index ($v.api.env | default dict) "AUTH_MODE" | default "")) "oidc") (not ($v.accessGrantSync | default dict).enabled) -}}
{{- fail "운영에서 담당자 로그인(api.env.AUTH_MODE=oidc)을 쓰면 accessGrantSync.enabled 를 켜야 한다 — 권한 부여·변경·말소 기록 3년 보관 (G-15, D-91)" -}}
{{- end -}}
{{- if not (has $v.global.environment (list "production" "staging" "local")) -}}
{{- fail (printf "global.environment 는 production | staging | local 이어야 한다: %s" $v.global.environment) -}}
{{- end -}}

{{- /* DB 커넥션 예산 (§B2, T-M4-09): 최대로 늘어났을 때도 전체 예산 안이어야 한다 */ -}}
{{- $apiMax := $v.api.replicas -}}
{{- if $v.api.autoscaling.enabled }}{{ $apiMax = $v.api.autoscaling.maxReplicas }}{{ end -}}
{{- $relay := 0 -}}{{- if $v.eventRelay.enabled }}{{ $relay = mul $v.eventRelay.replicas 3 }}{{ end -}}
{{- $docs := 0 -}}{{- if $v.documentService.enabled }}{{ $docs = mul $v.documentService.replicas 5 }}{{ end -}}
{{- $total := add (mul $apiMax $v.database.pool.maxPerPod) $relay $docs -}}
{{- if gt (int $total) (int $v.database.pool.connectionBudget) -}}
{{- fail (printf "DB 커넥션 예산 초과: 접수 API %d Pod × %d + Relay %d + 서류 워커 %d = %d > connectionBudget %d" (int $apiMax) (int $v.database.pool.maxPerPod) (int $relay) (int $docs) (int $total) (int $v.database.pool.connectionBudget)) -}}
{{- end -}}
{{- if $v.database.pooler.enabled -}}
  {{- if not (has $v.database.pooler.poolMode (list "session" "transaction")) -}}
  {{- fail (printf "database.pooler.poolMode 는 session | transaction 이어야 한다: %s" $v.database.pooler.poolMode) -}}
  {{- end -}}
  {{- if and (has $v.database.pooler.serverTlsSslMode (list "verify-ca" "verify-full")) (not $v.database.pooler.serverTlsCaFile) -}}
  {{- fail "DB TLS verify-ca/verify-full 은 database.pooler.serverTlsCaFile 이 필요하다" -}}
  {{- end -}}
  {{- if not (has $v.database.pooler.clientTlsSslMode (list "disable" "allow" "prefer" "require" "verify-ca" "verify-full")) -}}
  {{- fail (printf "database.pooler.clientTlsSslMode가 올바르지 않다: %s" $v.database.pooler.clientTlsSslMode) -}}
  {{- end -}}
  {{- $serverPerPod := add (int $v.database.pooler.defaultPoolSize) (int $v.database.pooler.reservePoolSize) -}}
  {{- $serverTotal := mul (int $v.database.pooler.replicas) $serverPerPod -}}
  {{- if gt $serverTotal (int $v.database.pool.connectionBudget) -}}
  {{- fail (printf "PgBouncer 서버 커넥션 예산 초과: %d Pod × (%d + reserve %d) = %d > connectionBudget %d" (int $v.database.pooler.replicas) (int $v.database.pooler.defaultPoolSize) (int $v.database.pooler.reservePoolSize) $serverTotal (int $v.database.pool.connectionBudget)) -}}
  {{- end -}}
  {{- $clientCapacity := mul (int $v.database.pooler.replicas) (int $v.database.pooler.maxClientConnections) -}}
  {{- if lt $clientCapacity (int $total) -}}
  {{- fail (printf "PgBouncer 클라이언트 수용량 부족: %d < 애플리케이션 최대 커넥션 %d" $clientCapacity (int $total)) -}}
  {{- end -}}
{{- end -}}

{{- if and $v.vault.enabled (not $v.vault.addr) -}}
{{- fail "vault.enabled 이면 vault.addr 가 필요하다 (T-M5-04)" -}}
{{- end -}}

{{- if eq $v.global.environment "production" -}}
  {{- if $v.runtimeSecret.create -}}
  {{- fail "production 에서는 차트가 Secret 을 만들지 않는다 — Vault 가 넣은 Secret 을 runtimeSecret.name 으로 참조한다 (§06)" -}}
  {{- end -}}
  {{- range $name, $img := dict "api" $v.api.image "eventRelay" $v.eventRelay.image "documentService" $v.documentService.image -}}
    {{- if or (not $img.digest) (hasPrefix "sha256:REPLACE" $img.digest) -}}
    {{- fail (printf "production 은 서명된 이미지 digest 가 필요하다 (%s.image.digest) — 태그로 배포하지 않는다 (§A6)" $name) -}}
    {{- end -}}
  {{- end -}}
  {{- if and $v.database.pooler.enabled (or (not $v.database.pooler.image.digest) (hasPrefix "sha256:REPLACE" $v.database.pooler.image.digest)) -}}
  {{- fail "production 은 서명된 이미지 digest 가 필요하다 (database.pooler.image.digest) — 태그로 배포하지 않는다 (§A6)" -}}
  {{- end -}}
  {{- if not $v.securityContext.readOnlyRootFilesystem -}}
  {{- fail "production 은 readOnlyRootFilesystem 이 true 여야 한다 (§05 Runtime 기준)" -}}
  {{- end -}}
  {{- if or (not $v.documentService.scannerEngine) (eq $v.documentService.scannerEngine "mock") -}}
  {{- fail "production 은 실 서류 검사 엔진이 필요하다 (documentService.scannerEngine: clamav, T-M5-08) — mock 이나 빈 값으로는 배포하지 않는다" -}}
  {{- end -}}
{{- end -}}
{{- if and $v.documentService.enabled (eq $v.documentService.scannerEngine "clamav") (not $v.documentService.clamav.host) -}}
{{- fail "clamav 엔진은 clamd 주소가 필요하다 (documentService.clamav.host) — 없으면 워커가 기동하지 않는다 (D-58)" -}}
{{- end -}}
