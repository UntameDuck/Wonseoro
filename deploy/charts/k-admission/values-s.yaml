# S Profile — 최종 지원 ~10,000건, 설계 CCU 500 (v1.0 §10.1)
#
# ⚠️ 파생값이다. 노션 첨부는 M(values-m.yaml)만 있다. v1.0 §10.1 의 Pod 초기값
# "4 vCPU / 8GB × 2" 와 M 첨부의 requests/limits 비율(1:4)로 정했다. 실측으로 보정한다 (M4 수치 시험).
api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 60
    customMetrics:
      requestRatePerPod: 120
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "8Gi" }
  podDisruptionBudget: { minAvailable: 1 }

eventRelay:
  replicas: 2

database:
  pool:
    maxPerPod: 20
    minPerPod: 2
    connectionBudget: 200          # 6 × 20 + Relay 6 + 서류 워커 5 = 131

peakMode:
  apiMinReplicas: 4
