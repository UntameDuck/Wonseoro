# K-Admission Helm values - M profile reference (v1.2, 2026-09-30)
#
# chart: deploy/charts/k-admission (layered on the chart's values.yaml, then the university's values.yaml)
# v1.2 changes from the first attachment - spec discrepancy register D-44, D-49, D-52:
#   - global.configVersion / deadlinePolicyVersion removed. Deadline and config versions come only from the
#     signed activation record in the university DB (2-person approval). Deploy values must not set them (D-44 6)
#   - reconciliation runs inside the admission API (hourly, advisory lock), not as a CronJob (D-44 4)
#   - eventRelay / documentService are part of the profile (D-44 5)
#   - database.pool.maxPerPod 40 -> 38: 10 API pods x 38 + relay 2 x 3 + document worker 5 = 391 <= 400 (D-44 7)
#   - peakMode.scheduledActivation is empty. The schedule comes from the university's peak-schedule.yaml and the
#     generated peak-mode.yaml overlay; a fixed timestamp here would suspend reconciliation forever (D-49, ADR-0006)
#   - nodePlacement.nodeTaintsPolicy Honor: a failed zone does not block rescheduling into the live zone (D-52)
#   - runtime: NODE_ENV=production, port 3001, probes /healthz and /readyz (see k-admission-runtime.yaml)
global:
  universityId: UNIV-A
  environment: production
  imageRegistry: registry.example.kr/k-admission
  imagePullPolicy: IfNotPresent

frontend:
  image:
    repository: frontend
    digest: sha256:REPLACE_WITH_SIGNED_DIGEST
  replicas: 3
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "2", memory: "1Gi" }
  podDisruptionBudget: { minAvailable: 2 }

api:
  image:
    repository: admission-api
    digest: sha256:REPLACE_WITH_SIGNED_DIGEST
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 60
    customMetrics:
      requestRatePerPod: 120
      p95LatencyMs: 500
      activeRequestsPerPod: 150
  resources:
    requests: { cpu: "2", memory: "4Gi" }
    limits: { cpu: "8", memory: "16Gi" }
  podDisruptionBudget: { minAvailable: 2 }

eventRelay:
  image:
    repository: event-relay
    digest: sha256:REPLACE_WITH_SIGNED_DIGEST
  replicas: 2
  batchSize: 100
  maxInFlight: 500
  backoff:
    initialMs: 500
    maxMs: 30000
    jitter: true

documentService:
  image:
    repository: document-service
    digest: sha256:REPLACE_WITH_SIGNED_DIGEST
  replicas: 1
  # production requires a real scanning engine (T-M5-08); mock or empty fails rendering
  scannerEngine: REPLACE_WITH_SCANNER_ENGINE

reconciliation:
  intervalMs: 3600000
  sinceHours: 48
  maxBatch: 500

peakMode:
  enabled: false
  window: ""
  scheduledActivation: ""
  scheduledEnd: ""
  apiMinReplicas: 8
  frontendMinReplicas: 4
  suspendNonCriticalJobs: true

database:
  mode: external-ha
  host: postgres-primary.database.svc
  port: 5432
  sslMode: verify-full
  pool:
    maxPerPod: 38
    minPerPod: 5
    connectionBudget: 400

redis:
  host: redis-ha.cache.svc
  port: 6379
  tls: true

objectStorage:
  endpoint: https://object.example.kr
  bucket: kadmission-univ-a-prod
  directUpload: true
  presignTtlSeconds: 600
  publicAccess: false

centralSync:
  endpoint: https://sync.k-admission.kr/internal/v1/events
  mtls: true
  offlineSpool:
    enabled: true
    maxAgeHours: 72
    highWatermarkEvents: 100000

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
  dropAllCapabilities: true
  automountServiceAccountToken: false

observability:
  otelEndpoint: http://otel-collector.kadmission-ops.svc:4317
  includeRequestBody: false
  piiLabelsAllowed: false

networkPolicy:
  defaultDeny: true

nodePlacement:
  topologyKey: topology.kubernetes.io/zone
  spreadMaxSkew: 1
  whenUnsatisfiable: DoNotSchedule
  nodeTaintsPolicy: Honor
