# Source: k-admission/templates/pgbouncer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: univ-a-pgbouncer
  labels:
    app.kubernetes.io/part-of: k-admission
    app.kubernetes.io/instance: univ-a
    app.kubernetes.io/version: "1.2.0"
    helm.sh/chart: k-admission-0.1.0
    kadmission.kr/university: "UNIV-A"
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
      app.kubernetes.io/instance: univ-a
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: k-admission
        app.kubernetes.io/instance: univ-a
        app.kubernetes.io/version: "1.2.0"
        helm.sh/chart: k-admission-0.1.0
        kadmission.kr/university: "UNIV-A"
        app: pgbouncer
        network-role: database-pooler
    spec:
      serviceAccountName: univ-a-pgbouncer
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app: pgbouncer
              app.kubernetes.io/instance: univ-a
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: registry.example.kr/k-admission/pgbouncer@sha256:REPLACE_WITH_SIGNED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 6432
          env:
            - { name: PGBOUNCER_PORT, value: "6432" }
            - { name: PGBOUNCER_POOL_MODE, value: "transaction" }
            - { name: PGBOUNCER_DEFAULT_POOL_SIZE, value: "10" }
            - { name: PGBOUNCER_RESERVE_POOL_SIZE, value: "2" }
            - { name: PGBOUNCER_MAX_CLIENT_CONNECTIONS, value: "500" }
            - { name: PGBOUNCER_QUERY_WAIT_TIMEOUT_SECONDS, value: "15" }
            - { name: PGBOUNCER_CLIENT_TLS_SSLMODE, value: "require" }
            - { name: PGBOUNCER_CLIENT_TLS_CERT_FILE, value: /etc/pgbouncer-tls/tls.crt }
            - { name: PGBOUNCER_CLIENT_TLS_KEY_FILE, value: /etc/pgbouncer-tls/tls.key }
            - { name: PGBOUNCER_SERVER_TLS_SSLMODE, value: "verify-full" }
            - { name: PGBOUNCER_SERVER_TLS_CA_FILE, value: "/etc/pgbouncer-ca/ca.crt" }
          envFrom:
            - secretRef:
                name: kadmission-univ-a-runtime
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 종료 순서 (ADR-0008): ① preStop 동안 엔드포인트에서 빠지기를 기다린다(그 사이 새 연결도 받는다)
          # ② SIGTERM — PgBouncer 는 새 연결을 받지 않고 기존 클라이언트가 떠나기를 기다린다
          # ③ 앱 DB 풀이 연결을 사용 횟수(maxUses)·idle 시한으로 돌려 다른 PgBouncer 로 옮겨 간다.
          # grace 는 preStop + 연결이 도는 시간보다 길어야 SIGKILL 이 쓰던 연결을 끊지 않는다.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            tcpSocket: { port: postgres }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: postgres }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: postgres }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: client-tls, mountPath: /etc/pgbouncer-tls, readOnly: true }
            - { name: database-ca, mountPath: /etc/pgbouncer-ca, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: client-tls
          secret:
            secretName: univ-a-pgbouncer-tls
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        - name: database-ca
          secret:
            secretName: univ-a-database-ca
            items: [{ key: ca.crt, path: ca.crt }]

