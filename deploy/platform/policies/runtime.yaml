# Source: k-admission/templates/api.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: univ-a-api
  labels:
    app.kubernetes.io/part-of: k-admission
    app.kubernetes.io/instance: univ-a
    app.kubernetes.io/version: "1.2.0"
    helm.sh/chart: k-admission-0.1.0
    kadmission.kr/university: "UNIV-A"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: univ-a-api
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "120"
    - type: Pods
      pods:
        metric:
          name: http_request_duration_p95_seconds
        target:
          type: AverageValue
          # Prometheus 단위는 초, Kubernetes quantity의 m은 1/1000이므로 ms와 수치가 같다.
          averageValue: "500m"
    - type: Pods
      pods:
        metric:
          name: http_active_requests
        target:
          type: AverageValue
          averageValue: "150"
