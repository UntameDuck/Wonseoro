    kadmission.kr/university: "UNIV-A"
    app: admission-api
spec:
  selector:
    matchLabels:
      app: admission-api
      app.kubernetes.io/instance: univ-a
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
      labels:
        app.kubernetes.io/part-of: k-admission
        app.kubernetes.io/instance: univ-a
        app.kubernetes.io/version: "1.2.0"
        helm.sh/chart: k-admission-0.1.0
        kadmission.kr/university: "UNIV-A"
        app: admission-api
        network-role: api
    spec:
      serviceAccountName: univ-a-api
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app: admission-api
              app.kubernetes.io/instance: univ-a
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.kr/k-admission/admission-api@sha256:REPLACE_WITH_SIGNED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
            - name: metrics
              containerPort: 9464
          env:
            - name: NODE_ENV
              value: "production"
            - name: UNIVERSITY_ID
              value: "UNIV-A"
            - name: CENTRAL_SYNC_URL
              value: "https://sync.k-admission.kr"
            - name: PORT
              value: "3001"
            - name: DB_POOL_MAX
              value: "38"
            - name: DB_PROXY_HOST
              value: "univ-a-pgbouncer"
            - name: DB_PROXY_PORT
              value: "6432"
            - name: DB_PROXY_SSLMODE
              value: "require"
            - name: RECON_SCHEDULE_INTERVAL_MS
              value: "3.6e+06"
            - name: RECON_SCHEDULE_SINCE_HOURS
              value: "48"
            - name: PEAK_MODE_ENABLED
              value: "false"
            - name: THROTTLE_MODE
              value: "enforce"
            - name: PEAK_MODE_SUSPEND_NON_CRITICAL_JOBS
              value: "true"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_METRICS_PORT
              value: "9464"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.kadmission-ops.svc:4317"
            - name: LOG_FORMAT
              value: json
            - name: S3_ENDPOINT
              value: "https://object.example.kr"
            - name: S3_BUCKET
              value: "kadmission-univ-a-prod"

          envFrom:
            - secretRef:
                name: kadmission-univ-a-runtime
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # liveness 는 프로세스만 본다 — DB 장애에 Pod 를 죽이면 Failover 중 전부 재시작한다.
          # readiness 만 DB 를 본다. 중앙·PG 는 넣지 않는다 (D-32).
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

