# sre-operator 의 Deployment 수정을 "규모·재시작" 으로 좁힌다 (§06 RBAC, T-M5-02 단계 8, D-68)
#
# 왜 필요한가
#   §06 은 sre-operator 를 "scale/restart/log, Secret 원문 금지" 로 정의한다. 재시작(`kubectl rollout restart`)은
#   Deployment 수정(patch)이라 RBAC 으로 Deployment patch 를 줘야 한다. 그런데 RBAC 은 **어느 필드를** 고치는지 가르지
#   못한다 — patch 권한이면 Pod 틀에 `env.valueFrom.secretKeyRef` 를 넣고 로그(pods/log, sre 가 볼 수 있다)로 Secret
#   원문을 꺼낼 수 있다. 이미지를 바꿔 서명 정책 밖의 코드를 돌릴 수도 있다(서명 정책이 막지만 이중으로).
#
# 규칙
#   sre 그룹이 보낸 Deployment UPDATE(patch 포함)는 Pod 틀이 그대로여야 한다. 허용하는 차이는 둘뿐이다
#     - spec.replicas                                   (규모 — `kubectl scale` 은 scale 하위 자원이라 여기 걸리지 않는다)
#     - Pod 틀 annotation `kubectl.kubernetes.io/restartedAt` (재시작)
#   배포(GitOps release-controller)·다른 그룹에는 걸리지 않는다.
#
# 클러스터 범위 자원이라 차트(네임스페이스 한정 배포 계정)에 둘 수 없다 — 플랫폼 관리자가 한 번 적용한다.
# 그룹 이름은 차트 values `rbac.sreGroup` 과 같아야 한다. Kubernetes 1.30+ (ValidatingAdmissionPolicy GA)
# 시험: tests/auth/k8s-rbac-kind.mjs
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kadmission-sre-operator-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: sre-operator
      expression: "request.userInfo.groups.exists(g, g == 'kadmission-sre')"
  variables:
    - name: restartKey
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newAnnotations
      expression: "object.spec.template.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "oldObject.spec.template.metadata.?annotations.orValue({})"
  validations:
    - expression: "object.spec.template.spec == oldObject.spec.template.spec"
      message: "운영 역할은 Pod 구성(이미지·환경변수·볼륨·Secret 참조)을 바꿀 수 없습니다. 규모 조정과 재시작만 할 수 있습니다."
      reason: Forbidden
    - expression: "object.spec.template.metadata.?labels.orValue({}) == oldObject.spec.template.metadata.?labels.orValue({})"
      message: "운영 역할은 Pod 라벨을 바꿀 수 없습니다. 규모 조정과 재시작만 할 수 있습니다."
      reason: Forbidden
    - expression: >-
        variables.newAnnotations.all(k, k == variables.restartKey || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k]))
        && variables.oldAnnotations.all(k, k == variables.restartKey || k in variables.newAnnotations)
      message: "운영 역할은 재시작 표시 말고는 Pod annotation 을 바꿀 수 없습니다."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kadmission-sre-operator-guard
spec:
  policyName: kadmission-sre-operator-guard
  validationActions: ["Deny"]
