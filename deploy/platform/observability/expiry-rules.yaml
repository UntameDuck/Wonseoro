# 인증서·자격증명 만료 사전 경보 (T-M5-65, 기술설계서 §01 B9 "30/14/7/3/1일")
#
# 지표: credential_expiry_timestamp_seconds{kind, name} — 서비스마다(server-kit expiry.ts).
#   kind = workload-cert(상호 TLS 인증서) · ca-cert(플랫폼 CA) · db-credential(Vault DB 동적 계정)
# 짧게 쓰는 것(워크로드 인증서 24시간·DB 계정 1시간)은 정상일 때도 하루 안에 끝난다 — 날짜 경보가 아니라
# "갱신이 멈췄다(수명의 1/3 아래로 내려갔다)" 경보를 따로 둔다. 날짜 경보(30/14/7/3/1일)는 오래 쓰는 것(CA·외부 인증서·서명키)에 건다.
#
# Prometheus chart(29.x) values 다: helm upgrade prometheus ... -f prometheus-values.yaml -f kpi-rules.yaml -f expiry-rules.yaml
#
# 이름은 만료 경보로 시작했지만 지금은 **모든 경보 규칙**(alerting_rules.yml)이 여기 있다 — 만료·WORM 대조·주기 작업·중앙 반영·
# 의존성 회로·서류 검사 엔진·시각·인증·권한 기록 수집(D-93). 파일 이름을 바꾸면 helm 명령·문서가 함께 바뀌어야 해 그대로 둔다.
# 경보를 고치거나 더하면 tests/alert-rules.test.yaml 에 울릴 때·조용할 때를 넣고 npm run check:alert-rules
serverFiles:
  alerting_rules.yml:
    groups:
      - name: k-admission-credential-expiry
        rules:
          # ── 날짜 경보 — 오래 쓰는 인증서·키 ───────────────────────────
          - alert: CredentialExpiresIn30Days
            expr: (min by (namespace, kind, name) (credential_expiry_timestamp_seconds{kind!~"workload-cert|db-credential"}) - time()) < 30 * 86400
            for: 10m
            labels: { severity: info, horizon: 30d }
            annotations:
              summary: "{{ $labels.kind }}/{{ $labels.name }} 가 30일 안에 끝난다 — 교체 일정을 잡는다"
          - alert: CredentialExpiresIn14Days
            expr: (min by (namespace, kind, name) (credential_expiry_timestamp_seconds{kind!~"workload-cert|db-credential"}) - time()) < 14 * 86400
            for: 10m
            labels: { severity: warning, horizon: 14d }
            annotations:
              summary: "{{ $labels.kind }}/{{ $labels.name }} 가 14일 안에 끝난다"
          - alert: CredentialExpiresIn7Days
            expr: (min by (namespace, kind, name) (credential_expiry_timestamp_seconds{kind!~"workload-cert|db-credential"}) - time()) < 7 * 86400
            for: 10m
            labels: { severity: warning, horizon: 7d }
            annotations:
              summary: "{{ $labels.kind }}/{{ $labels.name }} 가 7일 안에 끝난다 — 교체 훈련 절차로 바꾼다"
          - alert: CredentialExpiresIn3Days
            expr: (min by (namespace, kind, name) (credential_expiry_timestamp_seconds{kind!~"workload-cert|db-credential"}) - time()) < 3 * 86400
            for: 5m
            labels: { severity: critical, horizon: 3d }
            annotations:
              summary: "{{ $labels.kind }}/{{ $labels.name }} 가 3일 안에 끝난다"
          - alert: CredentialExpiresIn1Day
            expr: (min by (namespace, kind, name) (credential_expiry_timestamp_seconds{kind!~"workload-cert|db-credential"}) - time()) < 86400
            for: 1m
            labels: { severity: critical, horizon: 1d, page: "true" }
            annotations:
              summary: "{{ $labels.kind }}/{{ $labels.name }} 가 하루 안에 끝난다 — 지금 바꾼다"
          # ── 갱신 멈춤 — 짧게 쓰는 것 ──────────────────────────────────
          # 워크로드 인증서는 수명 2/3 에 다시 받는다(24시간 → 16시간째). 8시간 아래면 두 번 연속 못 받은 것
          - alert: WorkloadCertificateNotRenewed
            expr: (min by (namespace, name) (credential_expiry_timestamp_seconds{kind="workload-cert"}) - time()) < 8 * 3600
            for: 5m
            labels: { severity: critical, page: "true" }
            annotations:
              summary: "{{ $labels.name }} 의 워크로드 인증서가 갱신되지 않는다 — Vault PKI·네트워크를 본다"
          # DB 계정은 수명 2/3 에 바꾼다(1시간 → 40분째). 10분 아래면 교체가 멈춘 것 — 끝나면 Vault 가 세션을 끊는다
          - alert: DbCredentialNotRotated
            expr: (min by (namespace, name) (credential_expiry_timestamp_seconds{kind="db-credential"}) - time()) < 600
            for: 2m
            labels: { severity: critical, page: "true" }
            annotations:
              summary: "{{ $labels.name }} 의 DB 동적 계정이 교체되지 않는다 — 곧 DB 연결이 끊긴다"
          # 지표 자체가 사라졌다(상호 TLS 를 켠 워크로드인데 만료를 모른다).
          # absent() 는 Prometheus 하나가 여러 대학을 볼 때 한 대학이라도 지표가 있으면 나머지의 누락을 못 본다 — 대학 API 가 있는
          # (clock_offset_ms 를 내는) 대학마다 CA 만료 지표가 있는지 본다(D-93)
          - alert: CredentialExpiryUnknown
            expr: |
              count by (namespace) (clock_offset_ms)
                unless on (namespace) count by (namespace) (credential_expiry_timestamp_seconds{kind="ca-cert"})
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 플랫폼 CA 만료 지표가 없다 — 만료 경보가 꺼진 것과 같다(상호 TLS·인증서 지표를 본다)"

      # 감사 기록·권한 변경 기록 WORM 대조(D-75·D-91) — 대학 API 가 하루마다 조각과 DB 를 맞춘다(AUDIT_WORM_VERIFY_INTERVAL_MS).
      # 다르면 DB 슈퍼유저가 트리거를 끄고 지우거나 고친 것이다 — 원래 값은 WORM 조각에 있다(지운·고친 ID 는 API 로그)
      - name: k-admission-audit-worm-verify
        rules:
          - alert: AuditWormMismatch
            expr: max by (namespace, log, kind) (audit_worm_verify_mismatches) > 0
            for: 1m
            labels: { severity: critical, page: "true" }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.log }} 기록이 WORM 조각과 다르다({{ $labels.kind }}) — 감사 기록 변조 대응(보안 담당·문서 19)"
          # 주기(AUDIT_WORM_VERIFY_INTERVAL_MS, 최대 7일)의 두 배를 넘으면. 주기 지표가 없는 옛 앱이면 이틀
          - alert: AuditWormVerifyStale
            expr: |
              (
                (time() - max by (namespace) (audit_worm_verify_last_success_seconds))
                  > on (namespace) (2 * max by (namespace) (audit_worm_verify_interval_seconds))
              )
              or
              (
                (time() - max by (namespace) (audit_worm_verify_last_success_seconds) > 2 * 86400)
                  unless on (namespace) audit_worm_verify_interval_seconds
              )
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} WORM 대조가 주기의 두 배가 넘도록 끝나지 않았다 — 버킷 접근·대학 API 리더를 본다"

      # 수집 대상이 응답하지 않는다(D-93) — 다른 경보는 지표가 사라지면 조용해진다. 서비스가 통째로 내려가도 울리는 것은 이것뿐이다
      - name: k-admission-targets
        rules:
          - alert: ServiceAllTargetsDown
            # 차트 기본 수집(kubernetes-pods)은 한 대학의 서비스를 같은 job 으로 묶는다 — Pod 이름표 app 까지 묶어 서비스별로 본다(app 이 없으면 job 단위)
            expr: sum by (namespace, job, app) (up) == 0
            for: 3m
            labels: { severity: critical, page: "true" }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.job }} {{ $labels.app }} 의 수집 대상이 모두 응답하지 않는다 — 서비스 전체 중단일 수 있다. Pod·노드·NetworkPolicy(수집 허용)를 본다"
          - alert: ServiceTargetDown
            expr: (up == 0) unless on (namespace, job, app) (sum by (namespace, job, app) (up) == 0)
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.job }} 의 수집 대상 하나({{ $labels.instance }})가 응답하지 않는다 — 그 Pod 의 재시작·자원을 본다"

      # 대학 API 안의 주기 작업(대조·Outbox 보관·멱등 기록 정리, D-93) — 마지막 성공·주기·억제 여부는 모든 Pod 가 DB 기준으로 낸다.
      # 계속 실패하면 로그 경고뿐이던 것을 주기의 두 배에서 알린다. Peak Mode 억제 중에는 울리지 않는다(끝나면 5분 안에 다시 돈다)
      - name: k-admission-scheduled-jobs
        rules:
          - alert: ScheduledJobStale
            expr: |
              (
                (time() - max by (namespace, task) (scheduled_job_last_success_seconds))
                  > on (namespace, task) (2 * max by (namespace, task) (scheduled_job_interval_seconds))
              )
              unless on (namespace, task) (max by (namespace, task) (scheduled_job_suspended) == 1)
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 주기 작업 {{ $labels.task }} 이 주기의 두 배가 넘도록 끝나지 않았다 — 대학 API 로그의 실패 원인·DB 연결을 본다"

      # 중앙 반영(§B7 backlog age alert, D-93) — 지금까지 앱 로그 한 줄(central-health.gate)뿐이었다.
      # 기준은 앱 설정 SYNC_LAG_WARN_SECONDS 를 지표로 받아 같은 값을 쓴다(지표가 없는 옛 앱이면 앱 기본값 300초).
      # 접수는 계속된다(자율 운영) — 지원자 "내 원서"·중앙 통합 조회가 늦어질 뿐이라 warning
      - name: k-admission-central-sync
        rules:
          - alert: CentralSyncLagging
            expr: |
              (
                max by (namespace) (central_sync_lag_seconds)
                  >= on (namespace) max by (namespace) (central_sync_lag_warn_seconds)
              )
              or
              (max by (namespace) (central_sync_lag_seconds) >= 300 unless on (namespace) central_sync_lag_warn_seconds)
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 중앙이 모르는 가장 오래된 이벤트가 기준보다 오래됐다 — 접수는 계속된다. 중앙 연결·Relay·DEAD 이벤트를 본다"
          # 중앙에서 본 쪽(§04 sync.heartbeat, D-60) — 한 대학의 심장박동이 "연결됨" 기준(HEARTBEAT_STALE_SECONDS)을 넘게 끊겼다.
          # 그 대학 Data Plane 장애이거나 그 대학 → 중앙 길이 막힌 것이다(대학 쪽 경보가 같이 오는지 본다)
          - alert: UniversityHeartbeatStale
            expr: |
              max by (namespace, university) (university_heartbeat_age_seconds)
                > on (namespace) group_left max by (namespace) (university_heartbeat_stale_seconds)
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "중앙이 {{ $labels.university }} 의 심장박동을 기준보다 오래 받지 못했다 — 그 대학 Relay·중앙으로 가는 길·대학 쪽 경보를 본다"
          # 중앙이 대학 이벤트 순번에서 빈 곳을 찾았는데 30분이 지나도 메워지지 않았다 — 그 대학 Outbox 의 DEAD·Relay 를 본다
          - alert: CentralSyncGapsOpen
            expr: max by (namespace, university) (university_sync_gaps_open) > 0
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "중앙이 {{ $labels.university }} 의 이벤트 순번 누락을 메우지 못했다 — 그 대학 Outbox(DEAD 포함)·Relay 를 본다"
          # §10.4 고정 지표 "DB lock wait" — 잠깐의 대기는 정상이지만 10분 내내 끊기지 않으면 오래 잡힌 잠금(긴 트랜잭션·교착 직전)이다
          - alert: DbLockWaitSustained
            expr: max by (namespace) (db_lock_waiting_sessions) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 행 잠금을 기다리는 앱 세션이 10분 넘게 끊기지 않는다 — pg_stat_activity 로 오래 잡은 트랜잭션을 본다"
          # DEAD = 재시도를 멈춘 이벤트 — 중앙이 끝내 모르는 접수·취소다. 대조가 OUTBOX_DEAD_LETTER 예외를 열지만 대조 주기(최대 하루)를 기다리지 않는다
          - alert: OutboxDeadEvents
            expr: max by (namespace) (outbox_dead_events) > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 재시도를 멈춘 Outbox 이벤트가 있다 — 중앙이 모르는 변경이다. 운영 콘솔 「대조 · 예외」의 「통합 조회 전송을 포기한 알림」과 Relay 로그로 원인을 본다"

      # 외부 의존성 회로(§01 C8, D-93) — 열림은 로그 한 줄뿐이었다. 결제는 fail-open 금지라 열린 동안 결제 확인이 멈춘다(UNKNOWN → 대조)
      - name: k-admission-dependencies
        rules:
          - alert: PaymentGatewayCircuitOpen
            expr: max by (namespace) (dependency_circuit_open{dependency="payment-gateway"}) == 1
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }} 결제사 연결 회로가 열려 결제 확인이 멈췄다 — 결제는 확인 대기로 남고 대조가 넘겨받는다. 결제사 상태·출구를 본다"
          - alert: DependencyCircuitOpen
            expr: max by (namespace, dependency) (dependency_circuit_open{dependency!="payment-gateway"}) == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.dependency }} 회로가 열려 있다 — 그 의존성으로 가는 연결·상태를 본다(중앙 회로면 접수는 계속된다, 접수 API 회로면 서류 검사가 멈춘다)"
          # 검사 대기 서류가 있는데 15분 동안 검사가 하나도 끝나지 않았다 — 엔진은 살아 있어도 대상 조회·보고가 막힌 경우까지
          - alert: DocumentScanStalled
            expr: |
              (max by (namespace) (document_scan_pending) > 0)
              unless on (namespace)
              (sum by (namespace) (increase(document_scans_total[15m])) > 0)
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }} 검사 대기 서류가 있는데 검사가 끝나지 않는다 — 서류 워커 로그(대상 조회·결과 보고)·검사 엔진을 본다"
          # 서류 검사 엔진(clamd)에 닿지 못하면 서류가 검사 대기로 남아 지원자가 다음 단계로 못 간다
          - alert: ScanEngineUnavailable
            expr: max by (namespace, engine) (scan_engine_unavailable) == 1
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }} 서류 검사 엔진({{ $labels.engine }})에 닿지 못한다 — 올린 서류가 검사 대기로 남는다. 검사 엔진 상태·서명 DB 를 본다"

      # 시각·인증 (D-93) — 지표는 있었지만 경보가 없었다
      - name: k-admission-time-and-auth
        rules:
          # §A9 허용오차(MAX_CLOCK_OFFSET_MS 1000ms)를 넘은 Pod 는 접수를 확정하지 않는다(503 → Edge 가 다른 Pod 로)
          - alert: ClockOffsetExceeded
            expr: max by (namespace, pod) (abs(clock_offset_ms)) > 1000
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.pod }} 의 시계가 DB 와 1초 넘게 어긋나 이 Pod 는 접수를 확정하지 않는다 — 노드 NTP·DB 시계를 본다"
          # 필드 암호화(D-70)는 닫힌 실패다 — 키를 못 쓰면 원서 항목 값·공통원서를 읽지 못해 그 요청이 503 이 된다.
          # decrypt-failed 는 암호문이 다른 레코드로 옮겨 붙었거나 바뀐 경우에도 난다(변조 신호)
          - alert: FieldKeyUnavailable
            expr: sum by (namespace, reason) (increase(field_crypto_failures_total[5m])) > 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }} 필드 암호 키를 쓰지 못해({{ $labels.reason }}) 원서·공통원서를 읽지 못한다 — 키 묶음·Vault Transit 상태와 키 교체 이력을 본다(decrypt-failed 는 암호문 변조도 의심)"
          # 모든 Pod 가 넘었다 — 대개 DB 시계가 틀린 것이다. 이 대학은 접수 확정이 전면 중단된다(Edge 가 보낼 다른 Pod 가 없다)
          - alert: ClockOffsetExceededAllPods
            expr: |
              count by (namespace) (abs(clock_offset_ms) > 1000)
                == on (namespace) count by (namespace) (clock_offset_ms)
            for: 2m
            labels: { severity: critical, page: "true" }
            annotations:
              summary: "{{ $labels.namespace }} 모든 Pod 의 시계가 DB 와 1초 넘게 어긋나 접수 확정이 전면 중단됐다 — DB 서버 시계(NTP)부터 본다"
          # 발급자 키를 쓸 수 없어(보관 한도 초과) 토큰을 판단하지 못해 거절하고 있다 — 로그인한 사람도 막힌다
          - alert: IssuerKeysUnavailable
            expr: sum by (namespace, audience) (rate(auth_decisions_total{result="unavailable"}[5m])) > 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.audience }} 토큰을 판단하지 못해 거절하고 있다 — 발급자(로그인 서버) 연결·공개키를 본다"
          # 발급자 단절 중 만료 토큰을 유예로 받고 있다(D-67) — 접수는 되지만 발급자가 끊긴 것이다
          - alert: IssuerOutageGraceInUse
            expr: sum by (namespace, audience) (rate(auth_decisions_total{result="grace"}[5m])) > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} {{ $labels.audience }} 만료 토큰을 단절 유예로 받고 있다 — 발급자(로그인 서버)에 닿지 않는다"

      # 보안 통제가 막은 것(docs/13, D-93) — 카운터만 있고 경보가 없었다. 막혔으니 피해는 없지만 시도·설정 오류의 신호다
      - name: k-admission-security-signals
        rules:
          # 출구 허용 목록(T-M5-07) 밖으로 나가려 했다 — 새 의존 URL 을 configureEgress 에 안 넣었거나 SSRF 시도
          - alert: EgressDenied
            expr: sum by (namespace, reason) (increase(egress_denied_total[5m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 허용 목록 밖으로 나가려는 연결을 막았다({{ $labels.reason }}) — 새 의존 주소의 출구 등록 누락인지, 사용자 입력 주소로 나가려 한 것(SSRF)인지 로그를 본다"
          # 내부 경로(상호 TLS, D-69)에 신원이 없거나 다른 대학 신원으로 온 요청 — 위장 발신 시도 또는 인증서 문제
          - alert: InternalAuthRejected
            expr: sum by (namespace, result) (increase(internal_auth_decisions_total{result!="ok"}[5m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 내부 경로 요청을 거절했다({{ $labels.result }}) — 워크로드 인증서 만료·대학 신원 불일치, 또는 위장 발신 시도를 본다"
          # Vault(D-71) 요청이 실패·거절된다 — 계속되면 키 묶음·DB 동적 계정·인증서 갱신이 멈춘다
          - alert: VaultRequestsFailing
            expr: sum by (namespace, path_kind, result) (increase(vault_requests_total{result!="ok"}[5m])) > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} Vault {{ $labels.path_kind }} 요청이 실패한다({{ $labels.result }}) — Vault 상태·정책·로그인 수단을 본다(denied 는 정책 문제)"
          # 0003 이전 평문 원서 값이 아직 읽힌다 — 이전(field-keys encrypt-legacy)이 끝나지 않았다
          - alert: FieldPlaintextReads
            expr: sum by (namespace) (increase(field_plaintext_reads_total[1h])) > 0
            for: 1h
            labels: { severity: info }
            annotations:
              summary: "{{ $labels.namespace }} 암호화 전 평문 원서 값이 아직 읽힌다 — field-keys encrypt-legacy 로 옮긴다"

      # 권한 부여·변경·말소 기록 수집(G-15, D-91 — 차트 accessGrantSync CronJob, 1시간마다).
      # 멈춘 채 로그인 서버의 관리 이벤트 보관기간이 지나면 "누가 바꿨는지" 가 사라진다(대조 기록은 남지만 바꾼 사람 모름).
      # kube-state-metrics 지표다 — 로컬 축소 스택(prometheus-values.yaml)은 kube-state-metrics 를 꺼 두어 여기서는 울리지 않는다
      - name: k-admission-access-grant-sync
        rules:
          # 한계 = 수집 주기의 세 배와 3시간 중 긴 쪽(차트 schedule 을 바꿔도 맞게 — 주기 = 다음 예정 - 마지막 실행).
          # 아직 한 번도 실행되지 않았으면 3시간. 한 번도 성공하지 못한 CronJob 은 마지막 성공 지표가 없다 — 만든 지 한계가 지나면 같이 울린다
          - alert: AccessGrantSyncStale
            expr: |
              (
                (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-access-grant-sync"}))
                  > on (namespace, cronjob) (
                  clamp_min(3 * (max by (namespace, cronjob) (kube_cronjob_next_schedule_time{cronjob=~".+-access-grant-sync"}) - max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-access-grant-sync"})), 3 * 3600)
                  or on (namespace, cronjob) (0 * group by (namespace, cronjob) ({__name__=~"kube_cronjob_created|kube_cronjob_status_last_successful_time",cronjob=~".+-access-grant-sync"}) + 3 * 3600)
                )
              )
              or
              (
                (
                  (time() - max by (namespace, cronjob) (kube_cronjob_created{cronjob=~".+-access-grant-sync"}))
                    > on (namespace, cronjob) (
                  clamp_min(3 * (max by (namespace, cronjob) (kube_cronjob_next_schedule_time{cronjob=~".+-access-grant-sync"}) - max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-access-grant-sync"})), 3 * 3600)
                  or on (namespace, cronjob) (0 * group by (namespace, cronjob) ({__name__=~"kube_cronjob_created|kube_cronjob_status_last_successful_time",cronjob=~".+-access-grant-sync"}) + 3 * 3600)
                )
                )
                  unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob=~".+-access-grant-sync"}
              )
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 권한 변경 기록 수집이 주기의 세 배(최소 3시간)가 넘도록 성공하지 못했다 — 관리 이벤트(세부 포함)가 꺼졌거나 수집 클라이언트·DB 연결을 본다"
          # 실패한 Job 은 이력(failedJobsHistoryLimit 3)에 남아 kube_job_status_failed 가 계속 1 이다 — 그것만 보면
          # 한 번 실패한 뒤 다음 시간에 성공해도 실패 Job 이 지워질 때까지(ttlSecondsAfterFinished 1시간) 울린다. "마지막 성공보다 뒤에 만든 Job 이 실패했다" 만 본다
          # (성공한 적이 아직 없으면 실패 Job 이 있기만 해도). 시험: tests/alert-rules.test.yaml
          - alert: AccessGrantSyncFailing
            expr: |
              (
                max by (namespace) (kube_job_created{job_name=~".+-access-grant-sync-.+"} and on (namespace, job_name) (kube_job_status_failed{job_name=~".+-access-grant-sync-.+"} > 0))
                  > on (namespace) max by (namespace) (kube_cronjob_status_last_successful_time{cronjob=~".+-access-grant-sync"})
              )
              or
              (
                max by (namespace) (kube_job_created{job_name=~".+-access-grant-sync-.+"} and on (namespace, job_name) (kube_job_status_failed{job_name=~".+-access-grant-sync-.+"} > 0))
                  unless on (namespace) kube_cronjob_status_last_successful_time{cronjob=~".+-access-grant-sync"}
              )
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} 권한 변경 기록 수집 Job 이 실패했다 — 종료 코드 1 은 관리 이벤트 꺼짐 또는 해시 체인 끊김"
