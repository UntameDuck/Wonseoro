apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: univ-a
  namespace: kadmission-app
spec:
  interval: 5m
  timeout: 10m
  releaseName: univ-a
  targetNamespace: kadmission-app
  storageNamespace: kadmission-app
  serviceAccountName: release-controller
  chart:
    spec:
      chart: ./deploy/charts/k-admission
      sourceRef:
        kind: GitRepository
        name: wonseoro
        namespace: kadmission-app
      reconcileStrategy: Revision
      valuesFiles:
        - deploy/charts/k-admission/values.yaml
        - deploy/charts/k-admission/values-m.yaml
        - deploy/universities/UNIV-A/values.yaml
        - deploy/universities/UNIV-A/peak-mode.yaml   # 예약 자동화가 만든 Peak Mode — 마지막에 얹는다 (ADR-0006)
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
