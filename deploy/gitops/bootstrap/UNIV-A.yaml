apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wonseoro
  namespace: kadmission-app
spec:
  interval: 1m
  url: https://github.com/UntameDuck/Wonseoro.git
  ref:
    branch: main
  verify:
    mode: HEAD
    secretRef:
      name: wonseoro-git-authors
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wonseoro
  namespace: kadmission-app
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/gitops/clusters/univ-a
  prune: true
  wait: true
  serviceAccountName: release-controller
  sourceRef:
    kind: GitRepository
    name: wonseoro
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: univ-a
      namespace: kadmission-app
