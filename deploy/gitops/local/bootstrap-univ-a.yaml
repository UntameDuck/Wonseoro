apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wonseoro-local
  namespace: kadmission-app
spec:
  interval: 30s
  url: http://host.docker.internal:9418/Wonseoro.git
  ref:
    branch: main
  verify:
    mode: HEAD
    secretRef:
      name: wonseoro-git-authors
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wonseoro-local
  namespace: kadmission-app
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 10m
  path: ./deploy/gitops/local/univ-a
  prune: true
  wait: true
  serviceAccountName: release-controller
  sourceRef:
    kind: GitRepository
    name: wonseoro-local
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: univ-a
      namespace: kadmission-app
