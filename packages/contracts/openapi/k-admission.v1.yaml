  /admin/v1/support/lookups:
    post:
      tags: [Admin]
      operationId: createSupportLookup
      x-kadmission-register: D-79
      description: >
        Finds an application by application number or support code and returns the PII-minimal
        support view. Every lookup issues an evidence number, stores the exact response with its
        SHA-256 and appends SUPPORT_LOOKUP to the application's audit chain. Unknown numbers of either
