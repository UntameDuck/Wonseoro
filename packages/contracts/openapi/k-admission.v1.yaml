      description: >
        Requires a reason and the admissions office decision document number — the platform
        records and executes the office's decision, it does not decide. Then the normal
        two-person approval applies. Not blocked by the freeze window. If the base policy is no
        longer in force at activation time, activation is refused (409).
      security: [{ oidc: [admin] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, deadlineAt, reason, decisionRef]
              properties:
                cycleId: { type: string, format: uuid }
                deadlineAt: { type: string, format: date-time }
                reason: { type: string, minLength: 5 }
                decisionRef: { type: string, minLength: 1 }
      responses:
        '201':
          description: Extension draft
          content:
            application/json:
              schema:
                type: object
                required: [policyId, policyHash, version, extendsVersion]
                properties:
                  policyId: { type: string, format: uuid }
                  policyHash: { type: string }
                  version: { type: string }
                  extendsVersion: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
  /admin/v1/deadline-policies/{policyId}/approve:
    post:
      tags: [Admin]
      operationId: approveDeadlinePolicy
      security: [{ oidc: [admin] }]
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approval recorded
          content:
            application/json:
              schema:
                type: object
                required: [policyId, complete, remainingApprovals]
                properties:
                  policyId: { type: string, format: uuid }
                  complete: { type: boolean }
                  remainingApprovals: { type: integer, minimum: 0, maximum: 1 }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: Another approval landed first (conditional update); reload and retry
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/v1/deadline-policies/{policyId}/activate:
    post:
      tags: [Admin]
      operationId: activateDeadlinePolicy
      x-kadmission-register: D-22
      summary: Activate an approved deadline policy (optionally scheduled)
      description: >
        Symmetric with config activation. A policy that was applied once is never re-applied
        (no back door to an old deadline), and a deadline already in the past at activation time
        is refused (no retroactive closing). Recorded as a signed activation record.
      security: [{ oidc: [admin] }]
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateRequest' }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                required: [activatedAt, activation]
                properties:
                  activatedAt: { type: string, format: date-time }
                  activation: { $ref: '#/components/schemas/ActivationRecord' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/v1/activations:
    get:
      tags: [Admin]
      operationId: listActivations
      x-kadmission-register: D-35
      summary: Signed activation history for deadline policies and configs
      description: >
        Signatures are re-verified on every read. `allSignaturesValid` says the remaining records
        are genuine; `systemChain` says none are missing.
      security: [{ oidc: [admin] }]
      parameters:
        - $ref: '#/components/parameters/CycleIdQuery'
      responses:
        '200':
          description: Activation history
          content:
            application/json:
              schema:
                type: object
                required: [activations, allSignaturesValid, systemChain]
                properties:
                  activations:
                    type: array
                    items: { $ref: '#/components/schemas/ActivationRecord' }
                  allSignaturesValid: { type: boolean }
                  systemChain: { $ref: '#/components/schemas/ChainVerification' }
  /admin/v1/reconciliation/exceptions:
    get:
      tags: [Admin]
      operationId: listReconciliationExceptions
      description: Mismatches only, ordered by severity then newest (at most 200).
      security: [{ oidc: [operator] }]
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [OPEN, MANUAL_REVIEW, RESOLVED, AUTO_RESOLVED, ALL]
            default: OPEN
      responses:
        '200':
          description: Exceptions
          content:
            application/json:
              schema:
                type: object
                required: [exceptions]
                properties:
                  exceptions:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationException' }
        '400':
          $ref: '#/components/responses/Problem'
  /admin/v1/reconciliation/run:
    post:
      tags: [Admin]
      operationId: runReconciliation
      x-kadmission-register: D-26
      summary: Run the 4-way reconciliation now
      description: >
        Same path as the hourly schedule. Needed during incidents (SEV1 runbook) when waiting
        for the next batch is not an option. The window is bounded so one run cannot scan the
        whole history.
      security: [{ oidc: [operator] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sinceHours: { type: integer, minimum: 1, maximum: 720, default: 48 }
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema:
                type: object
                required: [checked, opened, autoResolved, stillOpen]
                properties:
                  checked: { type: integer, minimum: 0 }
                  opened: { type: integer, minimum: 0 }
                  autoResolved: { type: integer, minimum: 0 }
                  stillOpen: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/Problem'
  /admin/v1/reconciliation/{exceptionId}/resolve:
    post:
      tags: [Admin]
      operationId: resolveReconciliationException
      description: Records the judgement with before/after in the audit chain. Does not change the data.
      security: [{ oidc: [admin] }]
      parameters:
        - in: path
          name: exceptionId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolutionCode, reason]
              properties:
                resolutionCode: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Resolved and audited
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id: { type: string, format: uuid }
                  state: { type: string, const: RESOLVED }
        '400':
          $ref: '#/components/responses/Problem'
  /admin/v1/evidence/applications/{applicationId}:
    get:
      tags: [Admin]
      operationId: getEvidencePackage
      description: >
        Viewing is itself audited (ADMIN_VIEWED_PII) with the viewer and the reason.
        Contains no name, resident number, contact, address, application body or file originals.
      security: [{ oidc: [auditor] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - in: query
          name: reason
          required: true
          x-kadmission-register: D-24
          description: Purpose of access. Empty → 400.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Evidence package
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePackage' }
        '400':
          $ref: '#/components/responses/Problem'
  /admin/v1/evidence/by-number/{applicationNumber}:
    get:
      tags: [Admin]
      operationId: getEvidencePackageByNumber
      x-kadmission-register: D-24
      description: >
        Same as getEvidencePackage, found by the application number the applicant or the support
        record carries. Unknown numbers answer 404. Viewing is audited with the viewer and the reason.
      security: [{ oidc: [auditor] }]
      parameters:
        - in: path
          name: applicationNumber
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: reason
          required: true
          description: Purpose of access. Empty → 400.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Evidence package
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePackage' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/v1/retention/matrix:
    get:
      tags: [Admin]
      operationId: getRetentionMatrix
      x-kadmission-register: D-38
      summary: Retention floor and basis per data category
      description: >
        Retention is configured through the config `retention` section (two-person approval,
        diff, signed activation) — not here. Shortening a period shows as DESTRUCTIVE in the diff.
      security: [{ oidc: [admin] }]
      responses:
        '200':
          description: Retention categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/RetentionCategory' }
  /admin/v1/retention/plan:
    get:
      tags: [Admin]
      operationId: getRetentionPlan
      x-kadmission-register: D-38
      summary: What the active policy would purge and when — never executes
      security: [{ oidc: [admin] }]
      parameters:
        - $ref: '#/components/parameters/CycleIdQuery'
      responses:
        '200':
          description: Purge plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPlan' }
        '400':
          $ref: '#/components/responses/Problem'
  /internal/v1/documents/pending-scan:
    get:
      tags: [Internal]
      operationId: listDocumentsPendingScan
      x-kadmission-register: D-20
      summary: QUARANTINED documents waiting for the malware scanner
      description: Polled by document-service. The worker never writes the DB directly (ADR-0004).
      security: [{ mutualTLS: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Pending documents
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      required: [documentId, objectKey, mediaType, sizeBytes, sha256]
                      properties:
                        documentId: { type: string, format: uuid }
                        objectKey: { type: string }
                        mediaType: { type: string }
                        sizeBytes: { type: integer, minimum: 0 }
                        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                        downloadUrl:
                          type: string
                          format: uri
                          description: >
                            Short-lived presigned GET for this object only (D-58). The worker holds
                            no object-storage credentials; the scan engine streams the file from here.
  /internal/v1/documents/{documentId}/scan-result:
    post:
      tags: [Internal]
      operationId: reportDocumentScanResult
      x-kadmission-register: D-20
      security: [{ mutualTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [CLEAN, MALICIOUS, ERROR] }
                scanner: { type: string, description: Engine name recorded in the evidence (D-58) }
                engineVersion: { type: string, description: Engine and signature database version }
                signature: { type: string, maxLength: 200, description: What the engine found (MALICIOUS only) }
      responses:
        '200':
          description: Scan result applied
          content:
            application/json:
              schema:
                type: object
                required: [documentId, result, status]
                properties:
                  documentId: { type: string, format: uuid }
                  result: { type: string, enum: [CLEAN, MALICIOUS, ERROR] }
                  status: { type: string, enum: [UPLOADING, QUARANTINED, AVAILABLE, REJECTED, DELETED] }
        '400':
          $ref: '#/components/responses/Problem'
  /internal/v1/events:
    post:
      tags: [Internal]
      operationId: ingestUniversityEvent
      x-kadmission-register: D-60
      x-kadmission-external-callback: true
      description: >
        Deduplicated by the CloudEvents `(source, id)` pair (§04), not by Idempotency-Key — the
        relay retries the same event id. Events from a university that is not registered and
        ACTIVE are refused with 400 (UNKNOWN_UNIVERSITY) so the relay parks them instead of
        retrying. `kr.kadmission.sync.heartbeat.v1` updates the university's live state
        (backlog, config version, clock offset, last heartbeat) and is not kept in the event
        ledger; the dashboard marks a university unreachable when heartbeats stop.
      security: [{ mutualTLS: [] }]
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                required: [eventId, receiptId, acknowledgedAt]
                properties:
                  eventId: { type: string }
                  receiptId: { type: string }
                  acknowledgedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/Problem'
        '409': { description: Duplicate event; existing receipt may be returned }
  /internal/v1/events/{eventId}/receipt:
    get:
      tags: [Internal]
      operationId: getEventReceipt
      security: [{ mutualTLS: [] }]
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /internal/v1/sync/status:
    get:
      tags: [Internal]
      operationId: getSyncStatus
      description: >
        University-side outbox backlog, served by event-relay. A growing backlog with an OPEN
        circuit means central is down; with a CLOSED circuit, the relay itself is stuck.
        (The central host has its own per-university view on the same path; see Central tag docs.)
      security: [{ mutualTLS: [] }]
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                required: [universityId, oldestPendingAgeSeconds, pendingCount]
                properties:
                  universityId: { type: string }
                  oldestPendingAgeSeconds: { type: integer, minimum: 0 }
                  pendingCount: { type: integer, minimum: 0 }
                  deadCount: { type: integer, minimum: 0 }
                  circuit:
                    x-kadmission-register: D-32
                    description: Optional (compatible addition, §A16)
                    allOf: [{ $ref: '#/components/schemas/CircuitSnapshot' }]
  /healthz:
    get:
      tags: [Ops]
      operationId: getLiveness
      x-kadmission-register: D-32
      description: Process liveness only. Never checks the DB — restarting every Pod during a DB failover makes it worse.
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
  /readyz:
    get:
      tags: [Ops]
      operationId: getReadiness
      x-kadmission-register: D-32
      description: DB reachability only. External dependencies (central, PG) are deliberately excluded.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '503':
          $ref: '#/components/responses/Problem'
  /healthz/dependencies:
    get:
      tags: [Ops]
      operationId: getDependencyCircuits
      x-kadmission-register: D-32
      description: >
        Circuit breaker state of this Pod's external dependencies. Not part of readiness —
        if a central or PG outage failed readiness, every Pod would leave traffic and all
        submissions would stop. `clock` is this Pod's measured offset against the DB clock (§A9, D-61):
        a Pod whose offset exceeds 1000 ms refuses finalization only (503), not all traffic.
      security: []
      responses:
        '200':
          description: Dependency circuits
          content:
            application/json:
              schema:
                type: object
                required: [service, degraded, circuits, time]
                properties:
                  service: { type: string }
                  degraded: { type: boolean }
                  circuits:
                    type: array
                    items: { $ref: '#/components/schemas/CircuitSnapshot' }
                  clock: { $ref: '#/components/schemas/ClockReading' }
                  time: { type: string, format: date-time }
  /api/v1/dashboard/applications:
    get:
      tags: [Central]
      operationId: listMyApplications
      x-kadmission-register: D-39
      summary: My applications across universities (central summary, may lag)
      description: >
        Reads only the event-fed summary; never calls university DBs. Returns only the caller's
        rows (purpose-keyed HMAC reference, D-27/D-39). `lastSyncedAt` must be shown — a lagging
        summary is not a failed submission. The identifier in a query string is rejected (400)
        because URLs end up in proxy and browser logs.
      servers:
        - url: https://central.k-admission.kr
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      responses:
        '200':
          description: Summaries
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, applications]
                properties:
                  serverTime: { type: string, format: date-time }
                  applications:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/ApplicationSummary' }
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/profile:
    get:
      tags: [Central]
      operationId: getMyProfile
      x-kadmission-register: D-57
      summary: My common profile and per-university release consents
      description: >
        The common profile is written once and copied, with consent, into each university
        application as a point-in-time snapshot (§10 §3). Identity comes only from the
        authenticated subject (`x-authenticated-subject` behind the gateway; `x-subject-token`
        in dev-headers mode, refused in production). No subject token in the body or URL.
      servers:
        - url: https://central.k-admission.kr
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      responses:
        '200':
          description: Profile (empty fields when none was saved)
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonProfile' }
        '400':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Central]
      operationId: replaceMyProfile
      x-kadmission-register: D-57
      summary: Replace my common profile and release consents
      description: >
        Full replacement — sending the same body again gives the same result, so no
        Idempotency-Key is needed. Universities missing from `consents` have their consent
        revoked (recorded, not deleted); snapshots already copied into applications do not
        change. Consent can only name saved fields. Only the platform-standard common profile
        fields are accepted (highSchool, graduationYear, contactEmail, phone — contracts
        COMMON_PROFILE_FIELDS); an empty string or null removes a field.
      servers:
        - url: https://central.k-admission.kr
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties: false
                  properties:
                    highSchool: { type: [string, 'null'], maxLength: 100 }
                    graduationYear: { type: [integer, 'null'], minimum: 1990, maximum: 2100 }
                    contactEmail: { type: [string, 'null'], maxLength: 254 }
                    phone: { type: [string, 'null'], maxLength: 20 }
                consents:
                  type: array
                  items:
                    type: object
                    required: [universityId, fieldCodes]
                    properties:
                      universityId: { type: string }
                      fieldCodes:
                        type: array
                        items: { type: string }
                collectionConsentVersion:
                  type: [string, 'null']
                  x-kadmission-register: D-82
                  description: >
                    Version of the common profile collection-and-use text the applicant agreed to (1.12.0).
                    Anything but the current version is refused with 400 — the profile is not stored.
      responses:
        '200':
          description: Saved profile
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonProfile' }
        '400':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Central]
      operationId: deleteMyProfile
      x-kadmission-register: D-82
      summary: Delete my common profile
      description: >
        Right to erasure (PIPA Art. 36). Deletes the stored values, the data key and all
        per-university release consents. The release log keeps field codes only. Repeating it is
        harmless (`deleted: false`). Applications already created are not changed.
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      responses:
        '200':
          description: Deletion result
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, description: A stored profile existed and was removed }
        '400':
          $ref: '#/components/responses/Problem'
  /internal/v1/profile-snapshots:
    post:
      tags: [Central]
      operationId: releaseProfileSnapshot
      x-kadmission-register: D-17
      summary: Common Profile Vault — release consented fields to a university
      description: >
        Called by a university data plane when creating an application. Only the intersection of
        requested and consented fields leaves the vault; requested-but-unconsented fields are
        named in `withheldFields` instead of silently dropped. Best-effort: if central does not
        answer, the application is created empty (D-18). `applicationRef` is an opaque
        university-salted value, never the university's internal applicant id (D-39).
      servers:
        - url: https://central.k-admission.kr
      security: [{ mutualTLS: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectToken, universityId, requestedFields]
              properties:
                subjectToken: { type: string }
                universityId: { type: string }
                requestedFields:
                  type: array
                  items: { type: string }
                applicationRef: { type: string }
      responses:
        '200':
          description: Snapshot
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [fields, releasedFields, withheldFields, releasedAt]
                properties:
                  fields: { type: object, additionalProperties: true }
                  releasedFields:
                    type: array
                    items: { type: string }
                  withheldFields:
                    type: array
                    items: { type: string }
                  releasedAt: { type: string, format: date-time }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://id.example.kr/.well-known/openid-configuration
    mutualTLS:
      type: mutualTLS
  parameters:
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      in: path
      name: documentId
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema: { type: string, format: uuid }
    PrivacyRequestNumber:
      in: path
      name: requestNumber
      required: true
      schema: { type: string, pattern: '^PR-[0-9]{8}-[0-9A-HJKMNP-TV-Z]{6}$' }
    FeeRefundNumber:
      in: path
      name: requestNumber
      required: true
      schema: { type: string, pattern: '^FR-[0-9]{8}-[0-9A-HJKMNP-TV-Z]{6}$' }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
    CycleIdQuery:
      in: query
      name: cycleId
      required: true
      schema: { type: string, format: uuid }
    ConfigId:
      in: path
      name: configId
      required: true
      schema: { type: string, format: uuid }
    PolicyId:
      in: path
      name: policyId
      required: true
      schema: { type: string, format: uuid }
    SubjectToken:
      in: header
      name: x-subject-token
      required: true
      description: Applicant subject token. Header only — never in the URL (D-39).
      schema: { type: string, minLength: 1 }
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: >
        Too many requests for this applicant (code RATE_LIMITED, D-51, ADR-0007). Limits are per
        authenticated applicant and request class, never per IP, so many applicants behind one school NAT
        are not blocked together. The request was not processed; retry after `Retry-After` seconds with the
        same Idempotency-Key. A normal submit (finalize) is never limited for a low-risk session.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ServerTime:
      type: object
      required: [serverTime, deadlineAt, deadlinePolicyVersion]
      properties:
        serverTime: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        deadlinePolicyVersion: { type: string }
        clockOffsetMs: { type: integer }
    AdmissionCycle:
      type: object
      required: [id, admissionYear, name, opensAt, closesAt, status]
      properties:
        id: { type: string, format: uuid }
        universityId: { type: string }
        universityName: { type: string, description: Display name — the client shows this, not the id }
        admissionYear: { type: integer }
        name: { type: string }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        status: { type: string, enum: [DRAFT, OPEN, CLOSED, ARCHIVED] }
        notices:
          type: object
          x-kadmission-register: D-80
          description: >
            Legal notices from the approved configuration (1.10.0). Only keys that are set appear;
            the client draws nothing for a missing one rather than inventing a contact.
          additionalProperties: false
          properties:
            privacyPolicyUrl: { type: string, format: uri, maxLength: 500 }
            processorsUrl: { type: string, format: uri, maxLength: 500 }
            privacyOfficer: { type: string, maxLength: 200 }
            contact: { type: string, maxLength: 200 }
            feeRefund: { type: string, maxLength: 2000, description: Refund grounds, amounts and method }
            applicationRules:
              type: string
              maxLength: 2000
              x-kadmission-register: D-86
              description: >
                Application limits (early round count, one per regular-round group, no regular round
                after an early-round admission, no double registration) and their consequence, shown
                and acknowledged before an application is created (1.17.0).
    AdmissionType:
      type: object
      required: [id, code, name, feeAmount]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        feeAmount: { type: number, minimum: 0 }
    Department:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        quota: { type: [integer, 'null'], minimum: 0 }
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [cycleId, admissionTypeId, departmentId]
      properties:
        cycleId: { type: string, format: uuid }
        admissionTypeId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        consents:
          type: array
          x-kadmission-register: D-81
          description: Consent codes the applicant agreed to before creating (current text versions)
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        rulesAcknowledged:
          type: boolean
          x-kadmission-register: D-86
          description: >
            The applicant acknowledged `notices.applicationRules` before creating. A new application
            records APPLICATION_RULES_ACKNOWLEDGED with the SHA-256 of that text (1.17.0).
    UpdateApplicationRequest:
      type: object
      properties:
        admissionTypeId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        fields: { type: object, additionalProperties: true }
    Application:
      type: object
      required: [id, cycleId, status, version, serverTime]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        admissionTypeId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        status:
          type: string
          description: >
            DRAFT → READY (validate passed) → PAYMENT_PENDING (payment intent; no more edits) →
            PAID (payment confirmed) → FINALIZED (finalize transaction). A save moves READY back to
            DRAFT; a failed payment moves PAYMENT_PENDING back to READY. FINALIZING exists only inside
            the finalize transaction and is not stored (D-55). EXPIRED is reserved.
          enum: [DRAFT, READY, PAYMENT_PENDING, PAID, FINALIZING, FINALIZED, CANCELLED, EXPIRED]
        version: { type: integer, minimum: 1 }
        lastSavedAt: { type: [string, 'null'], format: date-time }
        fields: { type: object, additionalProperties: true }
        serverTime: { type: string, format: date-time }
    ValidationIssue:
      type: object
      required: [code, path, message]
      properties:
        code: { type: string }
        path: { type: string }
        message: { type: string }
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
    CreateUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [documentType, filename, mediaType, sizeBytes]
      properties:
        documentType: { type: string }
        filename: { type: string, maxLength: 512 }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
    UploadIntent:
      type: object
      required: [documentId, uploadUrl, expiresAt]
      properties:
        documentId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
    Document:
      type: object
      required: [id, status, filename, mediaType, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [UPLOADING, QUARANTINED, AVAILABLE, REJECTED, DELETED] }
        filename: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer }
    PaymentIntent:
      type: object
      required: [paymentId, amount, currency, provider, providerPayload]
      properties:
        paymentId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        provider: { type: string }
        providerPayload: { type: object, additionalProperties: true }
    Payment:
      type: object
      required: [id, status, amount, currency, provider]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [CREATED, PENDING, UNKNOWN, CONFIRMED, FAILED, CANCELLED, REFUNDED] }
        amount: { type: number }
        currency: { type: string }
        provider: { type: string }
        providerApprovedAt: { type: [string, 'null'], format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
    Submission:
      type: object
      required: [applicationId, submissionId, applicationNumber, status, requestedAt, finalizedAt, deadlinePolicyVersion, serverTime]
      properties:
        applicationId: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        applicationNumber: { type: string }
        status: { type: string, const: FINALIZED }
        requestedAt: { type: string, format: date-time }
        paymentVerifiedAt: { type: string, format: date-time }
        finalizedAt: { type: string, format: date-time }
        deadlinePolicyVersion: { type: string }
        configVersion: { type: string }
        serverTime: { type: string, format: date-time }
    ConfigVersion:
      type: object
      required: [id, version, status, configHash, createdBy, approvedBy, activatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED, ACTIVE, RETIRED] }
        configHash: { type: string }
        createdBy: { type: string }
        approvedBy:
          type: array
          maxItems: 2
          items: { type: string }
        activatedAt: { type: [string, 'null'], format: date-time }
    CreateConfigVersionRequest:
      type: object
      required: [cycleId, version, config]
      properties:
        cycleId: { type: string, format: uuid }
        version: { type: string, maxLength: 64 }
        config:
          type: object
          additionalProperties: true
          description: >
            Includes `forms` (JSON Schema per admission type code) and the optional `retention`
            section ({ <category>: { days } }), validated against the retention matrix (D-38).
    CreateDeadlinePolicyRequest:
      type: object
      required: [cycleId, version, mode, deadlineAt]
      properties:
        cycleId: { type: string, format: uuid }
        version: { type: string }
        mode:
          type: string
          enum: [FINALIZED_COMMIT_BEFORE_DEADLINE, REQUEST_RECEIVED_BEFORE_DEADLINE, PAYMENT_APPROVED_BEFORE_DEADLINE]
        deadlineAt: { type: string, format: date-time }
    ReconciliationException:
      type: object
      required: [id, applicationId, exceptionType, severity, state, detectedAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        exceptionType: { type: string }
        severity: { type: string, enum: [INFO, WARN, HIGH, CRITICAL] }
        state: { type: string, enum: [OPEN, AUTO_RESOLVED, MANUAL_REVIEW, RESOLVED] }
        facts: { type: object, additionalProperties: true }
        detectedAt: { type: string, format: date-time }
    EvidencePackage:
      type: object
      description: >
        Reconstruction of one application's submission process. `evidenceHash` excludes
        `generatedAt`, so two extractions of the same content hash identically.
      required: [applicationId, generatedAt, evidenceHash, application, submission, deadlinePolicy,
        configVersion, payments, documents, consents, timeline, chainVerification]
      properties:
        applicationId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        evidenceHash: { type: string }
        application:
          type: object
          required: [status, version, cycleId, admissionTypeCode, departmentCode]
          properties:
            status: { type: string }
            version: { type: string }
            cycleId: { type: string, format: uuid }
            admissionTypeCode: { type: string }
            departmentCode: { type: string }
        submission:
          type: [object, 'null']
          required: [applicationNumber, requestedAt, paymentVerifiedAt, finalizedAt,
            deadlinePolicyVersion, configVersion, serverClockOffsetMs, evidenceHash]
          properties:
            applicationNumber: { type: string }
            requestedAt: { type: string, format: date-time }
            paymentVerifiedAt: { type: string, format: date-time }
            finalizedAt: { type: string, format: date-time }
            deadlinePolicyVersion: { type: string }
            configVersion: { type: string }
            serverClockOffsetMs: { type: integer }
            evidenceHash: { type: string }
        deadlinePolicy:
          type: [object, 'null']
          description: The policy actually applied at submission time.
          required: [version, mode, deadlineAt, approvedBy, activatedAt, policyHash, signedActivation]
          properties:
            version: { type: string }
            mode: { type: string }
            deadlineAt: { type: string, format: date-time }
            approvedBy:
              type: array
              items: { type: string }
            activatedAt: { type: [string, 'null'], format: date-time }
            policyHash: { type: string }
            signedActivation:
              type: [object, 'null']
              description: null when the policy was applied before signed records existed.
              required: [activationId, kind, effectiveAt, operatorId, decisionRef, keyId, signature, matchesPolicy]
              properties:
                activationId: { type: string, format: uuid }
                kind: { type: string, enum: [ACTIVATE, EXTEND, ROLLBACK] }
                effectiveAt: { type: string, format: date-time }
                operatorId: { type: string }
                decisionRef: { type: [string, 'null'] }
                keyId: { type: string }
                signature: { $ref: '#/components/schemas/SignatureStatus' }
                matchesPolicy: { type: boolean }
        configVersion:
          type: [object, 'null']
          required: [version, configHash, activatedAt]
          properties:
            version: { type: string }
            configHash: { type: string }
            activatedAt: { type: [string, 'null'], format: date-time }
        payments:
          type: array
          items:
            type: object
            required: [provider, status, amount, providerApprovedAt, verifiedAt, events]
            properties:
              provider: { type: string }
              status: { type: string }
              amount: { type: number }
              providerApprovedAt: { type: [string, 'null'], format: date-time }
              verifiedAt: { type: [string, 'null'], format: date-time }
              events:
                type: array
                items:
                  type: object
                  required: [eventType, occurredAt, payloadHash]
                  properties:
                    eventType: { type: string }
                    occurredAt: { type: [string, 'null'], format: date-time }
                    payloadHash: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [documentType, status, sha256, scans]
            properties:
              documentType: { type: string }
              status: { type: string }
              sha256: { type: string }
              scans:
                type: array
                items:
                  type: object
                  required: [scanner, result, scannedAt]
                  properties:
                    scanner: { type: string }
                    engineVersion: { type: [string, 'null'] }
                    result: { type: string }
                    scannedAt: { type: [string, 'null'], format: date-time }
        consents:
          type: array
          items:
            type: object
            required: [consentCode, policyVersion, grantedAt]
            properties:
              consentCode: { type: string }
              policyVersion: { type: string }
              grantedAt: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            required: [at, action, result, actorType, actorId, traceId, configVersion]
            additionalProperties: true
            properties:
              at: { type: string, format: date-time }
              action: { type: string }
              result: { type: string }
              actorType: { type: string }
              actorId: { type: [string, 'null'], description: Pseudonymous; never the original identity }
              traceId: { type: [string, 'null'] }
              configVersion: { type: [string, 'null'] }
        chainVerification: { $ref: '#/components/schemas/ChainVerification' }
    ChainVerification:
      type: object
      required: [valid, checked]
      properties:
        valid: { type: boolean }
        checked: { type: integer, minimum: 0 }
        brokenAt: { type: string, description: First event id where the hash chain breaks }
    OperatingMode:
      type: object
      required: [mode, reason, since, lastCentralContactAt, sync, checkedAt, serverTime]
      properties:
        mode: { type: string, enum: [CONNECTED, AUTONOMOUS] }
        reason: { type: [string, 'null'], enum: [CENTRAL_NOT_CONFIGURED, CENTRAL_UNREACHABLE, null] }
        since: { type: string, format: date-time }
        lastCentralContactAt: { type: [string, 'null'], format: date-time }
        sync:
          type: object
          required: [pendingEvents, oldestPendingAgeSeconds, lagging]
          properties:
            pendingEvents: { type: integer, minimum: 0 }
            oldestPendingAgeSeconds: { type: integer, minimum: 0 }
            lagging: { type: boolean }
        checkedAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
    ServiceIncident:
      type: object
      required: [id, severity, title, message, startsAt, expectedResolvedAt, status, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [NOTICE, DEGRADED, OUTAGE] }
        title: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        expectedResolvedAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [ACTIVE, RESOLVED] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    AdminServiceIncident:
      allOf:
        - $ref: '#/components/schemas/ServiceIncident'
        - type: object
          required: [createdBy, resolvedBy]
          properties:
            createdBy: { type: string }
            resolvedBy: { type: [string, 'null'] }
    ServiceStatus:
      type: object
      required: [universityId, universityName, status, incidents, checkedAt]
      properties:
        universityId: { type: string }
        universityName: { type: string }
        status: { type: string, enum: [OPERATIONAL, NOTICE, DEGRADED, OUTAGE] }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/ServiceIncident' }
        checkedAt: { type: string, format: date-time }
    PublishServiceIncidentRequest:
      type: object
      required: [severity, title, message]
      additionalProperties: false
      properties:
        severity: { type: string, enum: [NOTICE, DEGRADED, OUTAGE] }
        title: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        expectedResolvedAt: { type: [string, 'null'], format: date-time }
    SigningKey:
      type: object
      required: [keyId, alg, publicKeyPem]
      properties:
        keyId: { type: string }
        alg: { type: string, const: Ed25519 }
        publicKeyPem: { type: string }
    SignatureStatus:
      type: string
      description: Re-verified on every read; not a stored value.
      enum: [VALID, INVALID, UNKNOWN_KEY]
    ActivateRequest:
      type: object
      properties:
        activateAt:
          type: string
          format: date-time
          description: Scheduled activation. Omit to activate now (the DB clock stamps the time, D-31).
    ActivationRecord:
      type: object
      description: Signed, append-only record of one activation event (T-M3-15).
      required: [activationId, subjectType, subjectId, subjectVersion, kind, effectiveAt, operatorId,
        reason, decisionRef, supersedesVersion, content, keyId, payloadHash, recordedAt, signature]
      properties:
        activationId: { type: string, format: uuid }
        subjectType: { type: string, enum: [DEADLINE_POLICY, CONFIG_VERSION] }
        subjectId: { type: string, format: uuid }
        subjectVersion: { type: string }
        kind: { type: string, enum: [ACTIVATE, EXTEND, ROLLBACK] }
        effectiveAt: { type: string, format: date-time }
        operatorId: { type: string }
        reason: { type: [string, 'null'] }
        decisionRef: { type: [string, 'null'], description: Admissions office decision document number (extensions) }
        supersedesVersion: { type: [string, 'null'] }
        content: { type: object, additionalProperties: true }
        keyId: { type: string }
        payloadHash: { type: string }
        recordedAt: { type: string, format: date-time }
        signature: { $ref: '#/components/schemas/SignatureStatus' }
    ConfigChange:
      type: object
      required: [path, kind, risk, summary]
      properties:
        path: { type: string }
        kind: { type: string, enum: [ADDED, REMOVED, CHANGED] }
        risk: { type: string, enum: [INFO, WARN, DESTRUCTIVE] }
        summary: { type: string }
        before: {}
        after: {}
    CommonProfile:
      type: object
      required: [fields, consents, updatedAt]
      properties:
        fields: { type: object, additionalProperties: true }
        consents:
          type: array
          items:
            type: object
            required: [universityId, fieldCodes, grantedAt]
            properties:
              universityId: { type: string }
              universityName:
                type: [string, 'null']
                description: Registry name of the university (1.5.0) — shown instead of the id
              fieldCodes:
                type: array
                items: { type: string }
              grantedAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        collectionConsent:
          x-kadmission-register: D-82
          description: Agreement to the current collection-and-use text, or null when it must be asked again (1.12.0)
          oneOf:
            - type: 'null'
            - type: object
              required: [version, consentedAt]
              properties:
                version: { type: string }
                consentedAt: { type: string, format: date-time }
    ClockReading:
      type: object
      description: This Pod's clock against the DB clock — the authority for submission time (§A2, §A9)
      required: [status, offsetMs, uncertaintyMs, sampledAt, source]
      properties:
        status: { type: string, enum: [SYNCED, OFFSET_EXCEEDED, UNMEASURED, STALE] }
        offsetMs: { type: integer, description: Pod clock minus DB clock }
        uncertaintyMs: { type: [integer, 'null'], description: Half of the shortest round trip }
        sampledAt: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [db] }
    ConfigDiff:
      type: object
      required: [changes, destructive, digest, identical]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
        destructive:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
        digest: { type: string, description: Send back as acknowledgedDiffDigest when approving }
        identical: { type: boolean, description: An identical config is refused on approval }
        warnings:
          type: array
          description: >
            Config linter warnings (§A5) — works, but may not be what was meant (unknown admission
            type code, field without title, legacy profile fields). Not part of the digest. Errors
            (a schema that does not compile, malformed document lists) refuse the draft instead.
          items: { type: string }
    DeadlinePolicy:
      type: object
      required: [policyId, version, mode, deadlineAt, status, approvedBy, activatedAt, policyHash,
        createdBy, createdAt, extension]
      properties:
        policyId: { type: string, format: uuid }
        version: { type: string }
        mode: { type: string }
        deadlineAt: { type: string, format: date-time }
        status:
          type: string
          enum: [DRAFT, APPROVED, ACTIVATED]
          x-kadmission-register: D-23
          description: >
            Lifecycle only. Which policy is in force is decided by activated_at order
            (scheduled activation), not by this field.
        approvedBy:
          type: array
          maxItems: 2
          items: { type: string }
        activatedAt: { type: [string, 'null'], format: date-time }
        policyHash: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        extension:
          type: [object, 'null']
          required: [kind, extendsVersion, extendsDeadlineAt, reason, decisionRef]
          properties:
            kind: { type: string, const: EXTENSION }
            extendsVersion: { type: string }
            extendsDeadlineAt: { type: string, format: date-time }
            reason: { type: string }
            decisionRef: { type: string }
    FormSchema:
      type: object
      required: [admissionTypeCode, schemaVersion, schema]
      properties:
        admissionTypeCode: { type: string }
        schemaVersion: { type: string, description: ACTIVE config version; stored with each field value }
        schema:
          type: object
          additionalProperties: true
          description: >
            JSON Schema of additional fields. Property annotations the client reads: `title` (label),
            `x-profile: true` (copied from the common profile), `x-multiline` (long text).
        profileFields:
          type: array
          description: Fields copied from the common profile vault (`x-profile`); drawn in step 1 (D-56)
          items: { type: string }
        documents:
          type: array
          description: >
            Documents this admission type accepts, from config `requiredDocuments` / `optionalDocuments`
            / `documentLabels` (D-56). Upload intents for other types are refused when the list is not
            empty. Required ones must be AVAILABLE before the payment intent.
          items:
            type: object
            required: [documentType, label, required]
            properties:
              documentType: { type: string }
              label: { type: string }
              required: { type: boolean }
              sensitiveConsentCode:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{0,63}$'
                x-kadmission-register: D-85
                description: >
                  Present only for sensitive documents (disability, health). The applicant must agree to
                  this separate consent before uploading; while such a document is attached the consent
                  is required for validation and payment (1.16.0).
        consents:
          type: array
          x-kadmission-register: D-81
          description: Consent texts of the active configuration and whether this application agreed to the current version (1.11.0)
          items: { $ref: '#/components/schemas/ApplicationConsentState' }
    ApplicationConsentState:
      type: object
      required: [code, title, text, required, version, granted]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        title: { type: string, maxLength: 100 }
        text: { type: string, maxLength: 4000, description: Purpose, items, retention, right to refuse }
        required: { type: boolean }
        version: { type: string, maxLength: 32 }
        granted: { type: boolean }
    SelfCheck:
      type: object
      required: [applicationId, serverTime, deadlineAt, deadlinePolicyVersion, application,
        submission, payment, documents, centralSync, timeline]
      properties:
        applicationId: { type: string, format: uuid }
        serverTime: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        deadlinePolicyVersion: { type: string }
        supportCode:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{10}$'
          x-kadmission-register: D-79
          description: >
            Support code (1.9.0) - the applicant reads it to the help desk instead of a name or phone
            number; shown as XXXXX-XXXXX. Fixed for the life of the application.
        application:
          type: object
          required: [status, lastSavedAt, summary]
          properties:
            status: { type: string }
            lastSavedAt: { type: [string, 'null'], format: date-time }
            summary: { type: string, description: One sentence the UI may show verbatim }
        submission:
          type: [object, 'null']
          required: [submissionId, applicationNumber, finalizedAt, deadlinePolicyVersion]
          properties:
            submissionId: { type: string, format: uuid }
            applicationNumber: { type: string }
            finalizedAt: { type: string, format: date-time }
            deadlinePolicyVersion: { type: string }
        payment:
          type: object
          required: [exists, guidance]
          properties:
            exists: { type: boolean }
            paymentId:
              type: string
              format: uuid
              description: Lets the client re-check this payment instead of creating another one
            status: { type: string }
            amount: { type: number }
            requestedAt:
              type: string
              format: date-time
              description: When the payment was requested (1.6.0) — shown while confirmation is pending
            providerApprovedAt: { type: [string, 'null'], format: date-time }
            verifiedAt: { type: [string, 'null'], format: date-time }
            guidance: { type: string, description: Never prompts a second payment while uncertain }
        documents:
          type: array
          items:
            type: object
            required: [documentType, status, guidance]
            properties:
              documentType: { type: string }
              status: { type: string }
              guidance: { type: string }
        centralSync:
          type: object
          description: Reported separately — pending central sync does not mean the submission failed.
          required: [pending, sent, lastSentAt, guidance]
          properties:
            pending: { type: integer, minimum: 0 }
            sent: { type: integer, minimum: 0 }
            lastSentAt: { type: [string, 'null'], format: date-time }
            guidance: { type: string }
        timeline:
          type: array
          maxItems: 200
          items:
            type: object
            required: [at, what, result]
            properties:
              at: { type: string, format: date-time }
              what: { type: string }
              result: { type: string }
    FeeRefundReason:
      type: string
      enum: [OVERPAID, UNIVERSITY_FAULT, DISASTER, HOSPITALIZED, DECEASED, STAGE_FAILED, EXEMPTION]
      description: Statutory refund grounds (art. 42-3) and fee exemption or reduction (paid first, refunded).
    FeeRefund:
      type: object
      required: [requestNumber, reason, method, accountMasked, detail, status, paidAmount, approvedAmount, receivedAt, decidedAt, resultNote]
      properties:
        requestNumber: { type: string, pattern: '^FR-[0-9]{8}-[0-9A-HJKMNP-TV-Z]{6}$' }
        reason: { $ref: '#/components/schemas/FeeRefundReason' }
        method: { type: string, enum: [ACCOUNT, VISIT] }
        accountMasked: { type: [string, 'null'], description: Last four digits only }
        detail: { type: [string, 'null'] }
        status: { type: string, enum: [RECEIVED, APPROVED, REJECTED] }
        paidAmount: { type: number }
        approvedAmount: { type: [number, 'null'] }
        receivedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        resultNote: { type: [string, 'null'] }
    FeeRefundQueueItem:
      allOf:
        - $ref: '#/components/schemas/FeeRefund'
        - type: object
          required: [applicationNumber, supportCode, applicationStatus, decidedBy, account]
          properties:
            applicationNumber: { type: [string, 'null'] }
            supportCode: { type: string }
            applicationStatus: { type: string }
            decidedBy: { type: [string, 'null'] }
            account:
              description: Only when one request is opened
              oneOf:
                - type: 'null'
                - type: object
                  required: [bank, holder, number]
                  properties:
                    bank: { type: string }
                    holder: { type: string }
                    number: { type: string }
    PrivacyRequestKind:
      type: string
      enum: [ACCESS, CORRECTION, DELETION, SUSPENSION]
      description: Access, correction, deletion or suspension of processing (Personal Information Protection Act arts. 35-37).
    PrivacyRequest:
      type: object
      required: [requestNumber, kind, status, detail, receivedAt, dueAt, decidedAt, resultNote]
      properties:
        requestNumber: { type: string, pattern: '^PR-[0-9]{8}-[0-9A-HJKMNP-TV-Z]{6}$' }
        kind: { $ref: '#/components/schemas/PrivacyRequestKind' }
        status: { type: string, enum: [RECEIVED, COMPLETED, PARTIALLY_COMPLETED, REFUSED] }
        detail: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, description: Statutory due time (10 days after receipt) }
        decidedAt: { type: [string, 'null'], format: date-time }
        resultNote: { type: [string, 'null'], description: The university's answer as written }
    PrivacyQueueItem:
      allOf:
        - $ref: '#/components/schemas/PrivacyRequest'
        - type: object
          required: [applicationNumber, supportCode, applicationStatus, decidedBy, daysLeft, overdue]
          properties:
            applicationNumber: { type: [string, 'null'], description: Null before submission }
            supportCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{10}$' }
            applicationStatus:
              type: string
              enum: [DRAFT, READY, PAYMENT_PENDING, PAID, FINALIZING, FINALIZED, CANCELLED, EXPIRED]
            decidedBy: { type: [string, 'null'] }
            daysLeft: { type: integer, description: Days until the due date in Korean dates (negative when past) }
            overdue: { type: boolean }
    SupportReason:
      type: string
      enum: [STATUS, PAYMENT, DOCUMENT, INCIDENT, OTHER]
      description: Category only - no free text, so staff never type personal data into the record.
    SupportView:
      type: object
      x-kadmission-register: D-79
      description: >
        Allow-list. Must not carry form values, common profile, document types or file names, names,
        contacts, applicant/application/payment/submission identifiers, provider references,
        admission type or department.
      required: [evidenceNumber, lookedUpAt, reason, lookupKind, universityName, cycleName, application,
        submission, payment, documents, centralSync, deadline, incidents, timeline, agentGuidance]
      properties:
        evidenceNumber: { type: string, pattern: '^SR-[0-9]{8}-[0-9A-HJKMNP-TV-Z]{6}$' }
        lookedUpAt: { type: string, format: date-time, description: DB time }
        reason: { $ref: '#/components/schemas/SupportReason' }
        lookupKind: { type: string, enum: [APPLICATION_NUMBER, SUPPORT_CODE] }
        universityName: { type: string }
        cycleName: { type: string }
        application:
          type: object
          additionalProperties: false
          required: [status, summary, lastSavedAt]
          properties:
            status: { type: string }
            summary: { type: string }
            lastSavedAt: { type: [string, 'null'], format: date-time }
        submission:
          type: object
          additionalProperties: false
          required: [submitted, applicationNumber, finalizedAt]
          properties:
            submitted: { type: boolean }
            applicationNumber: { type: [string, 'null'] }
            finalizedAt: { type: [string, 'null'], format: date-time }
        payment:
          type: object
          additionalProperties: false
          required: [status, amount, requestedAt, verifiedAt, guidance]
          properties:
            status: { type: [string, 'null'] }
            amount: { type: [number, 'null'] }
            requestedAt: { type: [string, 'null'], format: date-time }
            verifiedAt: { type: [string, 'null'], format: date-time }
            guidance: { type: string }
        documents:
          type: object
          additionalProperties: false
          description: Counts by status only
          required: [available, scanning, rejected, uploading]
          properties:
            available: { type: integer, minimum: 0 }
            scanning: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            uploading: { type: integer, minimum: 0 }
        centralSync:
          type: object
          additionalProperties: false
          required: [pending, sent, lastSentAt, guidance]
          properties:
            pending: { type: integer, minimum: 0 }
            sent: { type: integer, minimum: 0 }
            lastSentAt: { type: [string, 'null'], format: date-time }
            guidance: { type: string }
        deadline:
          type: object
          additionalProperties: false
          required: [deadlineAt]
          properties:
            deadlineAt: { type: [string, 'null'], format: date-time }
        incidents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, title, startsAt]
            properties:
              severity: { type: string, enum: [NOTICE, DEGRADED, OUTAGE] }
              title: { type: string }
              startsAt: { type: string, format: date-time }
        timeline:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [at, what, result]
            properties:
              at: { type: string, format: date-time }
              what: { type: string }
              result: { type: string }
        agentGuidance:
          type: array
          items: { type: string }
    CancelResult:
      type: object
      required: [applicationId, status, cancelledAt, refundRequired, paymentId]
      properties:
        applicationId: { type: string, format: uuid }
        status: { type: string, const: CANCELLED }
        cancelledAt: { type: string, format: date-time }
        refundRequired:
          type: boolean
          description: A confirmed payment exists; it is queued for a person to refund (no auto-refund).
        paymentId: { type: [string, 'null'], format: uuid }
    RetentionFloor:
      oneOf:
        - type: object
          required: [kind, days, basis]
          properties:
            kind: { const: LEGAL }
            days: { type: integer, minimum: 1 }
            basis: { type: string }
        - type: object
          required: [kind, basis]
          properties:
            kind: { const: INSTITUTION }
            basis: { type: string }
        - type: object
          required: [kind, basis]
          properties:
            kind: { const: IMMUTABLE }
            basis: { type: string }
    RetentionCategory:
      type: object
      required: [label, anchor, floor, purge, personal]
      properties:
        label: { type: string }
        anchor: { type: string, enum: [CYCLE_CLOSED, EVENT_TIME] }
        floor: { $ref: '#/components/schemas/RetentionFloor' }
        purge:
          type: string
          enum: [CONTENT, OBJECT, NONE]
          description: CONTENT clears content but keeps the row (the audit chain references it); OBJECT deletes the file and keeps its hash.
        personal: { type: boolean }
    RetentionPlan:
      type: object
      required: [cycleId, cycleClosesAt, configVersion, configured, problems, items, executes, generatedAt]
      properties:
        cycleId: { type: string, format: uuid }
        cycleClosesAt: { type: string, format: date-time }
        configVersion: { type: [string, 'null'] }
        configured: { type: boolean }
        problems:
          type: array
          items:
            type: object
            required: [category, message]
            properties:
              category: { type: string }
              message: { type: string }
        items:
          type: array
          items:
            type: object
            required: [code, label, floor, purge, days, dueAt, status, affected]
            properties:
              code: { type: string }
              label: { type: string }
              floor: { $ref: '#/components/schemas/RetentionFloor' }
              purge: { type: string, enum: [CONTENT, OBJECT, NONE] }
              days: { type: [integer, 'null'] }
              dueAt: { type: [string, 'null'], format: date-time }
              status: { type: string, enum: [UNSET, RETAINED, DUE, DUE_BUT_CHAINED, IMMUTABLE] }
              affected: { type: [integer, 'null'], description: Counted only when DUE }
        executes: { type: boolean, const: false, description: The plan never deletes anything }
        generatedAt: { type: string, format: date-time }
    CircuitSnapshot:
      type: object
      required: [name, state, consecutiveFailures, failureThreshold, openedAt, retryAfterMs, lastFailure]
      properties:
        name: { type: string }
        state: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        consecutiveFailures: { type: integer, minimum: 0 }
        failureThreshold: { type: integer, minimum: 1 }
        openedAt: { type: [string, 'null'], format: date-time }
        retryAfterMs: { type: integer, minimum: 0 }
        lastFailure: { type: [string, 'null'] }
    ProbeResult:
      type: object
      required: [service, status, time]
      properties:
        service: { type: string }
        status: { type: string, const: ok }
        time: { type: string, format: date-time }
    ApplicationSummary:
      type: object
      description: Central summary row. No personal data; the submission of record is the university DB.
      required: [universityId, applicationId, admissionYear, admissionTypeCode, departmentCode,
        status, applicationNumber, submittedAt, lastSyncedAt]
      properties:
        universityId: { type: string }
        universityName: { type: string }
        universityReachable:
          type: boolean
          description: >
            False when the university's heartbeat stopped (D-60) — this row may be stale. It does
            not mean the submission failed; the university page is the source of truth.
        universityLastHeartbeatAt: { type: [string, 'null'], format: date-time }
        applicationId: { type: string }
        admissionYear: { type: integer }
        admissionTypeCode: { type: string }
        departmentCode: { type: string }
        admissionTypeName:
          type: [string, 'null']
          description: Display name from the university (1.5.0). Null for rows synced before the university sent names.
        departmentName:
          type: [string, 'null']
          description: Display name from the university (1.5.0). Null for rows synced before the university sent names.
        status: { type: string }
        applicationNumber: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        lastSyncedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        traceId: { type: string }
        serverTime: { type: string, format: date-time }
security:
  - oidc: []
