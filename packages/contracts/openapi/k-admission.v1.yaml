openapi: 3.1.0
info:
  title: K-Admission University Data Plane API
  version: 1.19.0
  description: >
    Reference contract for a university-local K-Admission data plane.
    The university DB is the source of truth; central sync is not in the applicant critical path.


    1.2.0 aligns the contract with the repository implementation (spec discrepancy register
    D-7, D-16, D-17, D-19, D-20, D-22, D-24, D-26, D-32, D-34, D-35, D-37, D-38, D-39, D-40).
    Paths marked with `x-kadmission-register` were added by the implementation first.


    1.3.0 adds the common `429` response (`RateLimited`, `Retry-After`) to applicant operations (D-51).


    1.4.0 connects what the implementation had but the contract did not describe (D-55 to D-61):
    the application state machine is driven by validate / payment / finalize (READY, PAYMENT_PENDING,
    PAID are now real states and editing stops at PAYMENT_PENDING); one live payment per application
    (`200` resumes the open checkout, `409 PAYMENT_IN_PROGRESS` refuses a second payment); the form
    schema carries `profileFields` and `documents` so the client draws everything from config; the
    receipt is audited; server clock offset against the DB is reported (§A9); the applicant-facing
    common profile API on the central host; the active config includes its body and config drafts
    are linted (§A5); universities send the §04 heartbeat and the dashboard shows which university
    is unreachable. All additions are optional fields or new paths.


    1.5.0 adds display names so screens never show internal codes (T-M5-51): the dashboard summary
    carries `admissionTypeName` and `departmentName` (sent by the university in
    `application.finalized`), and common-profile consents carry `universityName`. Optional, additive.


    1.6.0 completes the receipt and the payment-pending screen (T-M5-56): the receipt carries
    `admissionTypeName`, `departmentName` and `status` (the T-M2-11 receipt items), and the self-check
    payment carries `requestedAt`. Additive.


    1.7.0 makes the catalog public (D-65): the current cycle, admission types and departments carry
    `security: []`. They are the same for everyone, contain no personal data, and are shown before
    sign-in (deadline, list of programmes) and by the staff console. Relaxing a requirement is compatible.


    1.8.0 adds the university-local public service status and operator incident ledger (T-M6-06,
    D-78). The public response contains only the university name and applicant guidance; publishing
    and resolving require the operator scope and recent authentication. New paths and schemas only.


    1.9.0 adds the PII-minimal support view (T-M6-07, D-79). Support staff (`support` scope) find an
    application by its application number or by the per-application support code the applicant sees
    on the self-check (`supportCode`, additive); every lookup issues an evidence number and keeps the
    exact response. The response is an allow-list: no form values, common profile, documents, names,
    contacts, internal identifiers or provider references. New paths, a new scope and an optional field.


    1.10.0 adds university notices to the current cycle (D-80, notes G-4 and G-6 of the privacy and
    legal notice review): privacy policy and processor disclosure links, the privacy officer, the
    admissions contact and the application fee refund terms, taken from the approved configuration.
    Optional field only.


    1.11.0 adds application consents (D-81, notes G-2 and G-11): the approved configuration carries
    consent texts (collection and use, school record provision); the form schema lists them with
    this application's state, the applicant records them with `PUT .../consents` or at creation
    (`consents`), each record keeps the text version and its SHA-256, a missing required consent is a
    validation issue `CONSENT_REQUIRED` and blocks the payment intent. New path and optional fields.


    1.12.0 records the common profile's own collection consent (D-82, note G-3): saving the profile
    carries `collectionConsentVersion` (the current text version, otherwise 400) and the profile
    reports `collectionConsent`. Optional fields in the schema; the server enforces the value.


    1.13.0 lets the applicant delete the common profile (`DELETE /api/v1/profile`, D-82, note G-10):
    values, data key and per-university release consents go; the release log (field codes only)
    stays. Applications already created keep their snapshot. New operation.


    1.14.0 opens the evidence package by application number (U-51): same auditor scope, recent
    authentication, mandatory reason and audit as the id-based path. New operation.


    1.15.0 adds data subject requests on a university application (D-84, note G-10): the owner asks
    for access, correction, deletion or suspension of processing; the request gets a number and a
    statutory due date (10 days). The admissions office works a queue, opens a request (recorded as a
    PII view) and answers once; partial or refused answers must give the reason. New operations.


    1.16.0 marks sensitive documents (D-85, note G-8): a form schema document may carry
    `sensitiveConsentCode`, the separate consent (Personal Information Protection Act art. 23) the
    applicant gives before uploading it. Upload intents for such a document are refused (400) until
    that consent is given, and validation reports CONSENT_REQUIRED while the document is attached
    without it. Optional field; behaviour applies only to configurations that mark documents.


    1.17.0 adds the application-limits notice (D-86, note G-12): `notices.applicationRules` is shown
    before an application is created and the create request may carry `rulesAcknowledged`, recorded
    with the text hash. Optional fields.


    1.18.0 documents field-level separate consent (D-88, note G-9): a form schema property may carry
    `x-sensitive-consent: <consent code>` (e.g. passport number, art. 24 of the Personal Information
    Protection Act). Saving a non-empty value for it is refused (400) until that consent is given, and
    validation reports CONSENT_REQUIRED while a value is stored without it. No schema change.


    1.19.0 adds application fee refund requests (D-89, note G-5): the owner of an application with a
    confirmed payment asks for a refund with a statutory reason or fee exemption, by bank transfer or
    in person; the admissions office opens (recorded) and decides once with an amount or a reason.
    New operations.


    Common rules:
    every mutation (POST/PATCH/PUT/DELETE) requires `Idempotency-Key`, except external callbacks
    that deduplicate by their own event id (`x-kadmission-external-callback: true`);
    JSON bodies must be valid UTF-8 — invalid bytes or malformed JSON are rejected with
    400 `VALIDATION_FAILED` and never stored (D-37);
    applicant resources owned by someone else answer exactly like missing resources (D-28);
    responses carrying personal data use `Cache-Control: no-store`.
servers:
  - url: https://{university}.apply.k-admission.kr
    variables:
      university:
        default: demo
tags:
  - name: Meta
  - name: Catalog
  - name: Applications
  - name: Support
    description: Applicant self-service status (§01 C7)
  - name: Documents
  - name: Payments
  - name: Submissions
  - name: Admin
  - name: Internal
  - name: Ops
    description: Kubernetes probes and dependency state. Not routed through the public ingress.
  - name: Central
    description: >
      Central Control/Convenience Plane (served by the central host, not the university host).
      Never on the applicant's submission critical path.
paths:
  /api/v1/meta/time:
    get:
      tags: [Meta]
      operationId: getServerTime
      security: []
      responses:
        '200':
          description: Server time and active deadline policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTime'
  /api/v1/meta/operating-mode:
    get:
      tags: [Meta]
      operationId: getOperatingMode
      x-kadmission-register: D-34
      summary: Autonomous-mode banner source
      description: >
        Last in-memory result of the central health gate. Public; carries no personal or
        internal operational data (failure counts and circuit state live in /healthz/dependencies).
        AUTONOMOUS changes guidance only — no applicant feature is blocked.
      security: []
      responses:
        '200':
          description: Operating mode
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatingMode' }
  /api/v1/meta/service-status:
    get:
      tags: [Meta, Support]
      operationId: getServiceStatus
      x-kadmission-register: D-78
      summary: University-local public service status and active notices
      description: >
        Remains available when the central plane is unavailable. Contains no personal data, internal
        topology, or root-cause detail; only guidance deliberately published for applicants.
      security: []
      responses:
        '200':
          description: Current university service status
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStatus' }
  /api/v1/meta/signing-keys:
    get:
      tags: [Meta]
      operationId: listSigningKeys
      x-kadmission-register: D-35
      summary: Public keys that verify signed activation records
      description: >
        Anyone can fetch these keys. With them and the activation records, a third party can
        verify outside the university that the applied deadline policy is exactly the approved one.
      security: []
      responses:
        '200':
          description: Ed25519 public keys
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/SigningKey' }
  /api/v1/admission-cycles/current:
    get:
      tags: [Catalog]
      operationId: getCurrentCycle
      security: []
      responses:
        '200':
          description: Current admission cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionCycle'
        '404':
          description: No cycle is open
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admission-types:
    get:
      tags: [Catalog]
      operationId: listAdmissionTypes
      security: []
      parameters:
        - in: query
          name: cycleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Admission types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdmissionType' }
  /api/v1/departments:
    get:
      tags: [Catalog]
      operationId: listDepartments
      security: []
      parameters:
        - in: query
          name: cycleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
  /api/v1/applications:
    post:
      tags: [Applications]
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplicationRequest' }
      responses:
        '201':
          description: Application created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      operationId: getApplication
      responses:
        '200':
          description: Application
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Applications]
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateApplicationRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '412':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/validate:
    post:
      tags: [Applications]
      operationId: validateApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/form-schema:
    get:
      tags: [Applications]
      operationId: getApplicationFormSchema
      x-kadmission-register: D-19
      summary: University-specific additional-field JSON Schema for this application
      description: >
        Resolved from the application's admission type and the ACTIVE config version, so the
        client never computes the combination. Owner only (knowing someone else's application id
        must not reveal which admission type they applied to).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Form schema
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormSchema' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/self-check:
    get:
      tags: [Support]
      operationId: getApplicationSelfCheck
      x-kadmission-register: D-16
      summary: What the server knows about this application, in plain words
      description: >
        Submission state, payment state (uncertain is reported as uncertain — never prompts a
        second payment), document scan state, central sync state reported separately from
        submission, and the attempt timeline. No personal data. Owner only.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Self-check
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfCheck' }
        '404':
          description: Not found — also for someone else's application (existence is not disclosed, D-28)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/consents:
    put:
      tags: [Applications]
      operationId: recordApplicationConsents
      x-kadmission-register: D-81
      description: >
        Agree to or withdraw consents of the current text versions. Only while the application is
        DRAFT or READY (payment locks it). Each record keeps the version and the SHA-256 of the text
        and is audited (CONSENT_RECORDED). Owner only.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [code, granted]
                    properties:
                      code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
                      granted: { type: boolean }
      responses:
        '200':
          description: Consent state after the change
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [consents]
                properties:
                  consents:
                    type: array
                    items: { $ref: '#/components/schemas/ApplicationConsentState' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/privacy-requests:
    post:
      tags: [Applications]
      operationId: createPrivacyRequest
      x-kadmission-register: D-84
      description: >
        Ask the university to give access to, correct, delete or stop processing the personal data of
        this application. Accepted in any application state. The free text is sealed with the
        application's data key. An open request of the same kind is returned as is (200) instead of a
        second one. Audited (PRIVACY_REQUEST_RECEIVED, without the text). Owner only.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/PrivacyRequestKind' }
                detail:
                  type: string
                  maxLength: 1000
                  description: What to show, correct, delete or stop. Required for CORRECTION.
      responses:
        '201':
          description: Request received
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '200':
          description: An open request of the same kind already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Applications]
      operationId: listPrivacyRequests
      x-kadmission-register: D-84
      description: The owner's requests on this application with the university's answers, newest first.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Requests
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [requests, dueDays]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/PrivacyRequest' }
                  dueDays: { type: integer, description: Statutory days to answer }
        '404': { $ref: '#/components/responses/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/fee-refunds:
    post:
      tags: [Applications]
      operationId: createFeeRefund
      x-kadmission-register: D-89
      description: >
        Ask for an application fee refund (Enforcement Decree of the Higher Education Act art. 42-3):
        a statutory reason or fee exemption, paid by bank transfer (account) or in person. Only for an
        application with a confirmed payment (409 otherwise). The account and text are sealed with the
        application's data key; responses show the last four digits only. An open request is returned
        as is (200). Audited (FEE_REFUND_REQUESTED, without account or text). Owner only.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, method]
              properties:
                reason: { $ref: '#/components/schemas/FeeRefundReason' }
                method: { type: string, enum: [ACCOUNT, VISIT] }
                account:
                  type: object
                  description: Required when method is ACCOUNT
                  required: [bank, holder, number]
                  properties:
                    bank: { type: string, maxLength: 40 }
                    holder: { type: string, maxLength: 40 }
                    number: { type: string, pattern: '^[0-9][0-9-]{5,29}$' }
                detail: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Request received
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeRefund' }
        '200':
          description: An open request already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeRefund' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Applications]
      operationId: listFeeRefunds
      x-kadmission-register: D-89
      description: The owner's refund requests on this application with the university's decisions, newest first.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Requests
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/FeeRefund' }
        '404': { $ref: '#/components/responses/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/cancel:
    post:
      tags: [Applications]
      operationId: cancelApplication
      x-kadmission-register: D-7
      summary: Cancel an application before it is received
      description: >
        Allowed from DRAFT, READY, PAYMENT_PENDING and PAID only. An application that has an
        application number (FINALIZED) is a received application and cannot be cancelled
        (409 — contact the admissions office). FINALIZING answers 409 with "check again shortly".
        A confirmed payment is never refunded automatically: it is queued as
        REFUND_REQUIRED_AFTER_CANCEL for a person to approve, and the payment stays CONFIRMED
        until the refund actually happens. The reason is audited but not sent to central.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelResult' }
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/documents/upload-intents:
    post:
      tags: [Documents]
      operationId: createUploadIntent
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadIntentRequest' }
      responses:
        '201':
          description: Upload intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/documents/{documentId}/complete:
    post:
      tags: [Documents]
      operationId: completeUpload
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, sizeBytes]
              properties:
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                sizeBytes: { type: integer, minimum: 0 }
      responses:
        '202':
          description: Accepted for malware/content validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/documents/{documentId}:
    delete:
      tags: [Documents]
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/payment-intents:
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      description: >
        Paying is submitting (D-42): once the payment is confirmed the server finalizes the
        application. So the intent is refused unless the application could be finalized now —
        valid fields, required documents AVAILABLE, a finalizable state, deadline not passed.
        Telling someone after they paid that a document is missing turns into a refund case.
        One live payment per application (D-55): if a payment whose checkout was only opened
        (CREATED) exists, the same checkout is returned with `200` instead of a new one; if a payment
        is being confirmed (PENDING, UNKNOWN) or is CONFIRMED, `409` with code `PAYMENT_IN_PROGRESS`
        — two checkouts can become two payments. The application moves to PAYMENT_PENDING and can no
        longer be edited.
      x-kadmission-register: D-55
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Payment intent (new checkout)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '200':
          description: The already open checkout of this application (no new payment was created)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409':
          description: >
            PAYMENT_IN_PROGRESS (a payment is being confirmed or is confirmed — do not pay again),
            or the application cannot be paid for in its current state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
