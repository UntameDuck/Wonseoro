      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/payments/{paymentId}/verify:
    post:
      tags: [Payments]
      operationId: verifyPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Verified payment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '202':
          description: Provider state temporarily unknown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/payments/callbacks/{provider}:
    post:
      tags: [Payments]
      operationId: receivePaymentCallback
      x-kadmission-register: D-40
      x-kadmission-external-callback: true
      summary: PG server-to-server callback
      description: >
        Called by the payment gateway over the internet. No applicant identity and no
        Idempotency-Key: the signature header authenticates the sender, and the provider event id
        deduplicates (payment_event unique). The body's payment status is never trusted — the
        server re-queries the PG. The first confirmation — by callback, by the applicant's verify
        or by the recheck worker — finalizes the application (D-42; the payment intent already
        checked it was finalizable). Any correctly signed callback answers 200 regardless of
        outcome so the PG stops retrying.
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          description: Must equal the PG this university contracted, otherwise 403.
          schema: { type: string }
        - in: header
          name: X-PG-Signature
          required: true
          description: Provider signature over the raw request body.
          schema: { type: string }
      requestBody:
        required: true
        description: Provider-specific payload. Only its transaction id and event id are used.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received: { type: boolean, const: true }
                  outcome: { type: string, enum: [VERIFIED, DUPLICATE, UNKNOWN_TX] }
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/applications/{applicationId}/finalize:
    post:
      tags: [Submissions]
      operationId: finalizeApplication
      description: >
        Normally the server has already finalized when the payment was confirmed (D-42), and this
        call returns that submission (200). It stays as the applicant's path for the rare case
        where automatic finalization failed after payment. CANCELLED or EXPIRED applications are
        never finalized, even with a confirmed payment (409) — that payment is a refund case.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing finalized result for idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '201':
          description: Application finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/applications/{applicationId}/submission:
