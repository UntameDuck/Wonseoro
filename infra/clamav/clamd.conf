# clamd 설정 — 서류 검사 엔진 (T-M5-08, docs/13 단계 6)
# 이미지 기본값(소켓·로그)에 더해, 검사하지 못한 것을 통과시키지 않는 쪽으로 둔다.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# 접수 서류 한도(PDF 10MB)보다 넉넉히. 넘으면 clamd 가 "size limit exceeded" 로 거절 → 워커는 검사 오류로 남긴다
StreamMaxLength 30M

# 압축 해제 한도 — Zip/PDF 폭탄. 한도를 넘으면 조용히 건너뛰지 않고 경보(Heuristics.Limits.Exceeded.*)
MaxScanSize 100M
MaxFileSize 25M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 60000
AlertExceedsMax yes

# 휴리스틱 — 매크로가 든 Office 문서, 풀 수 없는 암호화 문서·압축, 깨진 실행 파일
HeuristicAlerts yes
AlertOLE2Macros yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertBrokenMedia no
ScanPDF yes
ScanArchive yes
ScanOLE2 yes
