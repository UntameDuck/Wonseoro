# 로컬 개발 스택.
# 대학 Data Plane 격리 원칙을 로컬에서도 지킨다: 대학마다 별도 DB를 쓴다.
# M4에서 K-PaaS/kind 기반 실제 다중 클러스터로 교체한다.
name: wonseoro-dev

services:
  postgres-univ-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wonseoro
      POSTGRES_PASSWORD: wonseoro
      POSTGRES_DB: univ_a
    ports: ['5432:5432']
    volumes: ['./.data/pg-univ-a:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wonseoro -d univ_a']
      interval: 5s
      timeout: 3s
      retries: 10

  # M4 분산 실증용. 평소에는 `--profile multi` 로만 띄운다.
  postgres-univ-b:
    image: postgres:16-alpine
    profiles: ['multi']
    environment:
      POSTGRES_USER: wonseoro
      POSTGRES_PASSWORD: wonseoro
      POSTGRES_DB: univ_b
    ports: ['5442:5432']
    volumes: ['./.data/pg-univ-b:/var/lib/postgresql/data']

  # 중앙 Plane 전용 DB. 대학 DB 와 **같은 인스턴스를 쓰지 않는다.**
  # 중앙이 죽어도 대학 접수가 계속되는지 확인하려면 물리적으로 분리되어야 한다.
  postgres-central:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wonseoro
      POSTGRES_PASSWORD: wonseoro
      POSTGRES_DB: central
    # 5433 은 다른 프로젝트가 쓰는 경우가 있어 5434 를 쓴다.
    ports: ['5434:5432']
    volumes: ['./.data/pg-central:/var/lib/postgresql/data']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  # S3 호환 Object Storage. 서류는 브라우저에서 여기로 직접 업로드한다.
  # MinIO OSS 종료 뒤 로컬 구현체만 RustFS 로 교체했다(D-83). 운영 제품 계약은 S3 호환으로 중립이다.
  object-storage-permissions:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    user: '0:0'
    entrypoint: ['sh', '-ec']
    command: ['chown -R 10001:10001 /data']
    volumes: ['object-storage-data:/data']
    restart: 'no'

  object-storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    depends_on:
      object-storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: wonseoro
      RUSTFS_SECRET_KEY: wonseoro123
      # 지원자 웹이 서명 URL 로 직접 PUT 한다. 빈 값이나 * 대신 로컬의 신뢰할 오리진만 연다(D-83).
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:4000,http://localhost:4001
    ports: ['9000:9000', '9001:9001']
    volumes: ['object-storage-data:/data']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # PG Sandbox 대체. M2까지는 Mock Provider로 개발한다.
  pg-mock:
    image: mockserver/mockserver:latest
    profiles: ['payment']
    ports: ['1080:1080']

  # 로컬 OIDC 발급자 (T-M5-02·10, docs/12-authentication-plan.md A1).
  # 렐름 두 개를 시작할 때 읽어 들인다 — infra/auth/*.realm.json. 개발 전용(start-dev, 내장 DB).
  # 담당자 렐름은 비밀번호 + TOTP, 지원자 렐름은 본인확인 흉내다. 시험 계정은 infra/auth/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    profiles: ['auth']
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: kcadmin-dev
      KC_HOSTNAME: http://localhost:18080
    ports: ['18080:8080']
    # 렐름 파일(가져오기)과 원서로 로그인 테마(접근성 보완, infra/auth/themes)
    volumes: ['../auth:/opt/keycloak/data/import:ro', '../auth/themes:/opt/keycloak/themes:ro']

  # 비밀 저장소 (T-M5-04, docs/13 단계 4) — 개발 모드(메모리 저장, 봉인 해제됨, 루트 토큰 고정). 재시작하면 비어 있다.
  # 구성: node scripts/vault/dev-vault.mjs — 노션 첨부 vault-policy.hcl 을 대학마다 적용
  vault:
    image: hashicorp/vault:1.21@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    profiles: ['vault']
    cap_add: ['IPC_LOCK']
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ['8200:8200']
    extra_hosts: ['host.docker.internal:host-gateway']

  # 서류 악성코드 검사 엔진 (T-M5-08, docs/13 단계 6) — 시작할 때 서명 DB 를 내려받는다(처음 몇 분, 메모리 약 1.3GB).
  # 워커: SCANNER_ENGINE=clamav CLAMD_HOST=localhost
  clamav:
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    profiles: ['av']
    ports: ['3310:3310']
    volumes: ['../clamav/clamd.conf:/etc/clamav/clamd.conf:ro', 'clamav-db:/var/lib/clamav']

volumes:
  object-storage-data:
  clamav-db:
