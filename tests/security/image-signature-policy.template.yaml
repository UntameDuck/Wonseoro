apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: wonseoro-signature-proof
spec:
  mode: enforce
  images:
    - glob: "${IMAGE_GLOB}"
  authorities:
    - name: current-security-run
      keyless:
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subject: "${SIGNER_SUBJECT}"
